function initOrderMap(order, tracking) {
  const mapEl = document.getElementById('order-map');
  const fallbackEl = document.getElementById('map-fallback');
  if (!mapEl) return;

  if (typeof L === 'undefined') {
    if (fallbackEl) fallbackEl.style.display = 'block';
    mapEl.style.display = 'none';
    return;
  }

  try {
    if (_currentLeafletMap) {
      _currentLeafletMap.remove();
      _currentLeafletMap = null;
    }

    const farmLoc = { lat: 16.5449, lng: 81.5212, label: 'Farmer Farm (Bhimavaram)' };
    const buyerLoc = { lat: Number(order.dest.lat) || 16.5062, lng: Number(order.dest.lng) || 80.6480, label: order.dest.label || 'Buyer Destination' };
    const curLoc = (tracking && tracking.currentLoc) ? tracking.currentLoc : farmLoc;

    const map = L.map('order-map', { zoomControl: true }).setView([curLoc.lat, curLoc.lng], 10);
    _currentLeafletMap = map;

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const farmIcon = L.divIcon({
      html: '<div style="background:#35632F;color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,0.3)">🌱</div>',
      iconSize: [32, 32],
      className: 'df-map-marker'
    });
    const buyerIcon = L.divIcon({
      html: '<div style="background:#722F37;color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,0.3)">📍</div>',
      iconSize: [32, 32],
      className: 'df-map-marker'
    });
    const truckIcon = L.divIcon({
      html: '<div style="background:#0F52BA;color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 8px rgba(0,0,0,0.4);border:2px solid #fff">🚚</div>',
      iconSize: [36, 36],
      className: 'df-map-marker'
    });

    L.marker([farmLoc.lat, farmLoc.lng], { icon: farmIcon })
      .addTo(map)
      .bindPopup(`<b>Pickup: ${esc(farmLoc.label)}</b>`);

    L.marker([buyerLoc.lat, buyerLoc.lng], { icon: buyerIcon })
      .addTo(map)
      .bindPopup(`<b>Delivery: ${esc(buyerLoc.label)}</b>`);

    L.marker([curLoc.lat, curLoc.lng], { icon: truckIcon })
      .addTo(map)
      .bindPopup(`<b>Current Location: ${esc(curLoc.label || 'In Transit')}</b>`);

    const polyline = L.polyline([
      [farmLoc.lat, farmLoc.lng],
      [curLoc.lat, curLoc.lng],
      [buyerLoc.lat, buyerLoc.lng]
    ], { color: '#722F37', weight: 4, opacity: 0.7, dashArray: '6, 8' }).addTo(map);

    const bounds = L.latLngBounds([
      [farmLoc.lat, farmLoc.lng],
      [curLoc.lat, curLoc.lng],
      [buyerLoc.lat, buyerLoc.lng]
    ]);
    map.fitBounds(bounds, { padding: [50, 50] });
  } catch(e) {
    console.warn('Map initialization failed:', e);
    if (fallbackEl) fallbackEl.style.display = 'block';
    mapEl.style.display = 'none';
  }
}

function startTrackingPoll(orderId) {
  stopTrackingPoll();
  trackingOrderId = orderId;

  const pollAction = async () => {
    if (document.visibilityState !== 'visible') return;
    const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (!CURRENT_USER || p[1] !== 'track') {
      stopTrackingPoll();
      return;
    }

    try {
      const token = window.DFApi.getToken();
      const res = await fetch(`/api/tracking/${orderId}?token=${encodeURIComponent(token)}`);
      if (res.ok) {
        const data = await res.json();
        if (data && data.success) {
          trackingDataCache[orderId] = data;

          const locEl = document.getElementById('trackLocText');
          const statusEl = document.getElementById('trackStatusText');
          const updEl = document.getElementById('trackUpdatedText');

          if (locEl && data.currentLoc) locEl.textContent = data.currentLoc.label || 'In Transit';
          if (statusEl && data.status) statusEl.textContent = SL[data.status] || data.status;
          if (updEl && data.lastUpdated) updEl.textContent = ago(data.lastUpdated);

          const ord = MY_ORDERS.find(o => o.id === orderId);
          if (ord) initOrderMap(ord, data);

          if (data.status === 'delivered') {
            stopTrackingPoll();
          }
        }
      }
    } catch(err) {
      console.warn('Tracking poll error:', err);
    }
  };

  trackingPollTimer = setInterval(pollAction, 10000);
}

function stopTrackingPoll() {
  if (trackingPollTimer) {
    clearInterval(trackingPollTimer);
    trackingPollTimer = null;
  }
  trackingOrderId = null;
}

function startLiveLocationSharing(orderId) {
  if (!navigator.geolocation) {
    return toast('Geolocation is not supported by your browser.', 'err');
  }

  stopLiveLocationSharing();
  activeGpsOrderId = orderId;
  toast('Requesting device GPS permission...');

  liveGpsWatchId = navigator.geolocation.watchPosition(
    async (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const speed = pos.coords.speed;
      try {
        const token = window.DFApi.getToken();
        await fetch('/api/tracking/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token,
            orderId,
            lat,
            lng,
            speed,
            label: 'Driver Vehicle (GPS Active)'
          })
        });
      } catch(e) {
        console.warn('Error pushing live location:', e);
      }
      render();
    },
    (err) => {
      console.warn('GPS watch error:', err);
      toast('Could not access device GPS: ' + (err.message || 'Permission denied'), 'err');
      stopLiveLocationSharing();
      render();
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );

  toast('Live GPS broadcast active for Order #' + orderId.slice(0, 8).toUpperCase());
  render();
}

function stopLiveLocationSharing() {
  if (liveGpsWatchId !== null) {
    navigator.geolocation.clearWatch(liveGpsWatchId);
    liveGpsWatchId = null;
  }
  activeGpsOrderId = null;
  render();
}

/* ============ AGMARKNET Live Market Prices ============ */
async function loadMarketPrices(commodity, stateId, force) {
  if (MARKET_PRICES_LOADING && !force) return;
  MARKET_PRICES_LOADING = true;
  MARKET_PRICES_ERROR = null;

  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (p[1] === 'prices') render();

  try {
    if (!AVAILABLE_COMMODITIES.length) {
      const fRes = await fetch('/api/market-prices/filters');
      if (fRes.ok) {
        const fJson = await fRes.json();
        if (fJson.success) {
          AVAILABLE_COMMODITIES = fJson.commodities || [];
          AVAILABLE_STATES = fJson.states || [];
        }
      }
    }

    const c = commodity || SELECTED_PRICE_COMMODITY || 'Tomato';
    const s = stateId || SELECTED_PRICE_STATE || 2;
    SELECTED_PRICE_COMMODITY = c;
    SELECTED_PRICE_STATE = s;

    const res = await fetch(`/api/market-prices?commodity=${encodeURIComponent(c)}&state=${s}`);
    if (!res.ok) {
      throw new Error(`Server returned status ${res.status}`);
    }
    const data = await res.json();
    if (!data || data.success === false) {
      throw new Error(data && data.error ? data.error : 'Failed to fetch market rates');
    }

    MARKET_PRICES_DATA = data;

    if (window.DFPricing && window.DFPricing.setOfficialPrice && data.found) {
      window.DFPricing.setOfficialPrice(data.commodity, data);
    }
  } catch(err) {
    console.warn('Error loading market prices:', err);
    MARKET_PRICES_ERROR = 'Market prices are temporarily unavailable. ' + (err.message || '');
  } finally {
    MARKET_PRICES_LOADING = false;
    const curP = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (curP[1] === 'prices') render();
  }
}

function changePriceCommodity(val) {
  SELECTED_PRICE_COMMODITY = val;

function changePriceState(val) {

        <div class="field"><label for="b_dest">Delivery destination</label><select id="b_dest" onchange="updBuy('${l.id}')">${townOpts(u.loc.label)}</select></div>
        <div class="field"><label for="b_pay">Payment mode</label><select id="b_pay"><option>Cash on delivery</option><option>UPI on delivery</option></select></div>
      </div>

      <div class="field"><label for="b_addr">Delivery address or landmark</label><input id="b_addr" placeholder="Street, shop name or landmark"></div>
      <div class="sumbox" id="b_sum"></div>
      <button type="button" id="orderBtn" class="btn btn-primary btn-lg" style="width:100%" onclick="placeOrder('${l.id}')">Place direct order</button>
    </div>`;
  } else if (m.type === 'edit') {
    const l = MY_LISTINGS.find(x => x.id === m.id);
    if (!l) return '';
    inner = `<div class="mbody">
      <h2 style="font-size:26px;margin-bottom:16px">Edit ${esc(l.crop)} listing</h2>
      <div class="two">
        <div class="field"><label for="e_price">Price (₹ per kg)</label><input id="e_price" type="number" step="any" value="${l.price}"></div>
        <div class="field"><label for="e_qty">Quantity available (kg)</label><input id="e_qty" type="number" step="any" value="${l.qty}"></div>
      </div>
      <button type="button" class="btn btn-primary" onclick="saveEdit('${l.id}')">Save changes</button>
    </div>`;
  } else if (m.type === 'offer') {
    const r = OPEN_REQS.find(x => x.id === m.id);
    if (!r) return '';
    const ms = MY_LISTINGS.filter(l => l.status === 'active' && l.qty > 0).map(l => matchScore(r, l, u)).filter(Boolean);
    if (!ms.length) return `<div class="mbody"><h2 style="font-size:22px">No active matching produce</h2><p class="small" style="margin:12px 0">You do not have active produce matching this requirement. Add produce first.</p><button type="button" class="btn btn-ghost" onclick="closeModal()">Close</button></div>`;

    inner = `<div class="mbody">
      <h2 style="font-size:26px">Send an offer to ${esc(r.buyerOrg)}</h2>
      <p class="small" style="margin:6px 0 18px">They need ${r.qty - (r.filled || 0)} kg ${esc(r.crop)} at up to ${inr(r.maxPrice)}/kg.</p>
      <div class="field"><label for="o_l">Which produce listing</label><select id="o_l">${ms.map(x => `<option value="${x.l.id}">${esc(x.l.crop)} · ${x.l.qty} kg at ${inr(x.l.price)}/kg (Grade ${x.l.grade})</option>`).join('')}</select></div>
      <div class="two">
        <div class="field"><label for="o_qty">Quantity you can supply (kg)</label><input id="o_qty" type="number" min="1" value="${Math.min(ms[0].l.qty, r.qty - (r.filled || 0))}"></div>
        <div class="field"><label for="o_price">Your offered price (₹ per kg)</label><input id="o_price" type="number" step="any" value="${ms[0].l.price}"></div>
      </div>
      <div class="field"><label for="o_del">Delivery arrangement</label><select id="o_del"><option value="1">I can deliver to buyer location</option><option value="0">Buyer picks up at farm</option></select></div>
      <button type="button" class="btn btn-primary" onclick="sendOffer('${r.id}')">Submit direct offer</button>
    </div>`;
  } else if (m.type === 'rate') {
    inner = `<div class="mbody">
      <h2 style="font-size:26px">Rate this seller</h2>
      <p class="small" style="margin:6px 0 12px">Your feedback builds trust across the agricultural community.</p>
      <div class="stars" id="stars">${[1, 2, 3, 4, 5].map(i => `<button type="button" onclick="setStar(${i})" aria-label="${i} star${i > 1 ? 's' : ''}">★</button>`).join('')}</div>
      <button type="button" class="btn btn-primary" style="margin-top:16px" onclick="saveRating('${m.id}')">Submit rating</button>
    </div>`;
  }

  return `<div class="overlay" onclick="if(event.target===this)closeModal()" role="dialog" aria-modal="true">
    <div class="modal">
      <button type="button" class="x" onclick="closeModal()" aria-label="Close">${ic('x', 18)}</button>
      ${inner}
    </div>
  </div>`;
}

let selectedProfileRole = 'auto';
function setProfileRole(btn, role) {
  selectedProfileRole = role;
  const seg = document.querySelectorAll('#profRoleSeg button');
  seg.forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
}

async function doProfileAuthLogin() {
  if (S.isSubmitting) return;
  const uidInput = $('#p_uid');
  const pwdInput = $('#p_pwd');
  const errBox = $('#profileAuthErr');
  const btn = $('#profLoginBtn');

  const uid = (uidInput ? uidInput.value : '').trim().toLowerCase();
  const pwd = pwdInput ? pwdInput.value : '';

  const showErr = msg => {
    if (errBox) {
      errBox.textContent = msg;
      errBox.hidden = false;
    }
    toast(msg, 'err');
  };

  if (!uid) return showErr('Please enter your Unique ID or Email.');
  if (!pwd) return showErr('Please enter your password.');

  S.isSubmitting = true;
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Authenticating...`;
  }
  if (errBox) errBox.hidden = true;

  try {
    let res = null;
    let targetRole = selectedProfileRole;

    if (targetRole === 'auto') {
      try {
        res = await window.DFApi.login({ email: uid, password: pwd, role: 'farmer' });
        targetRole = 'farmer';
      } catch (fErr) {
        const msg = (fErr.message || '').toLowerCase();
        if (msg.includes('buyer') || msg.includes('not registered as a farmer') || msg.includes('wrong role') || msg.includes('role')) {
          res = await window.DFApi.login({ email: uid, password: pwd, role: 'buyer' });
          targetRole = 'buyer';
        } else {
          try {
            res = await window.DFApi.login({ email: uid, password: pwd, role: 'buyer' });
            targetRole = 'buyer';
          } catch (bErr) {
            throw fErr;
          }
        }
      }
    } else {
      res = await window.DFApi.login({ email: uid, password: pwd, role: targetRole });
    }

    if (!res || !res.user) {
      throw new Error('Authentication succeeded but user profile could not be loaded.');
    }

    CURRENT_USER = res.user;
    currentAuthState = AUTH_STATE.AUTHENTICATED;
    closeModal();
    toast(`Welcome back, ${CURRENT_USER.name}! Logged into ${CURRENT_USER.role} account.`);
    await reloadAppData();
    go('#/' + CURRENT_USER.role);
    startPolling();
  } catch (err) {
    console.error('Profile login error:', err);
    showErr(err.message || 'Login failed. Please check your credentials.');
  } finally {
    S.isSubmitting = false;
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = `${ic('user', 18)} Sign in to Account`;
    }
  }
}

let starVal = 0;
function setStar(n) {
  starVal = n;
  document.querySelectorAll('#stars button').forEach((b, i) => b.classList.toggle('on', i < n));
}
async function saveRating(id) {
  if (!starVal) return toast('Pick a star rating first.', 'err');
  try {
    await window.DFApi.rateOrder(id, starVal);
    starVal = 0;
    S.modal = null;
    toast('Thanks for rating this seller!');
    await reloadAppData();
    render();
  } catch(e) {
    toast(e.message || 'Could not submit rating.', 'err');
  }
}

function stepQty(d) {
  const i = $('#b_qty');
  if (!i) return;
  i.value = Math.max(1, Math.min(+i.max, (+i.value || 0) + d));
  i.oninput();
}
function updBuy(id) {
  const l = ACTIVE_LISTINGS.find(x => x.id === id);
  if (!l || !$('#b_qty')) return;
  const q = Math.max(0, Math.min(l.qty, parseFloat($('#b_qty').value) || 0));
  const dest = town($('#b_dest').value);
  const fee = deliveryFee(l.loc, dest);
  $('#b_sum').innerHTML = `<div class="row"><span>${q} kg × ${inr(l.price)}</span><span>${inr(q * l.price)}</span></div><div class="row"><span>Delivery (${Math.round(km(l.loc, dest))} km)</span><span>${inr(fee)}</span></div><div class="row t"><span>Total payable</span><span>${inr(q * l.price + fee)}</span></div>`;
}

async function placeOrder(id) {
  if (S.isSubmitting) return;
  if (!CURRENT_USER) {
    go('#/buyer/login');
    return toast('Please log in to place an order.', 'err');
  }
  const token = (typeof localStorage !== 'undefined' && localStorage.getItem('df_buyer_token')) || window.DFApi.getToken();
  if (!token) {
    return handleSessionExpired();
  }

  const l = ACTIVE_LISTINGS.find(x => x.id === id);
  const q = parseFloat($('#b_qty').value);
  if (!l || l.status !== 'active') return toast('This produce is no longer available.', 'err');
  if (!(q >= 1) || q > l.qty) return toast(`Choose between 1 and ${l.qty} kg.`, 'err');

  S.isSubmitting = true;
  const btn = $('#orderBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Processing order...`; }

  try {
    const dest = town($('#b_dest').value);
    await window.DFApi.placeOrder({
      token,
      listingId: l.id,
      qty: q,
      dest,
      address: $('#b_addr').value.trim(),
      pay: $('#b_pay').value
    });

    S.modal = null;
    toast('Order placed successfully! Decremented in database.');
    await reloadAppData();
    go('#/buyer/orders');
  } catch(e) {
    toast(e.message || 'Failed to place order.', 'err');
    await reloadAppData();
    render();
  } finally {
    S.isSubmitting = false;
    if (btn) { btn.disabled = false; btn.textContent = 'Place direct order'; }
  }
}

async function sendOffer(rid) {
  const r = OPEN_REQS.find(x => x.id === rid);
  const l = MY_LISTINGS.find(x => x.id === $('#o_l').value);
  const q = parseFloat($('#o_qty').value);
  const p = parseFloat($('#o_price').value);

  if (!l) return toast('Select a valid listing.', 'err');
  if (!(q > 0) || q > l.qty) return toast(`Offer quantity must be between 1 and ${l.qty} kg.`, 'err');
  if (!(p > 0)) return toast('Enter your price per kg.', 'err');

  try {
    await window.DFApi.createOffer({
      reqId: rid,
      listingId: l.id,
      qty: q,
      price: p,
      delivery: $('#o_del').value === '1'
    });

    S.modal = null;
    toast('Offer sent to ' + r.buyerOrg);
    await reloadAppData();
    render();
  } catch(e) {
    toast(e.message || 'Failed to send offer.', 'err');
    await reloadAppData();
    render();
  }
}

/* ============ Data Synchronization ============ */
async function reloadAppData() {
  try {
    PUBLIC_STATS = await window.DFApi.publicStats();
    ACTIVE_LISTINGS = await window.DFApi.listListings((LISTINGS_PAGE + 1) * PAGE_SIZE, 0);
    HAS_MORE_LISTINGS = ACTIVE_LISTINGS.length >= (LISTINGS_PAGE + 1) * PAGE_SIZE;

    if (CURRENT_USER) {
      if (CURRENT_USER.role === 'farmer') {
        MY_LISTINGS = await window.DFApi.myListings();
        MY_ORDERS = await window.DFApi.myOrders();
        OPEN_REQS = await window.DFApi.listOpenRequirements();
        MY_OFFERS = await window.DFApi.myOffers();
      } else {
        MY_ORDERS = await window.DFApi.myOrders();
        MY_REQS = await window.DFApi.myRequirements();
        MY_OFFERS = await window.DFApi.myOffers();
      }
    }
  } catch(err) {
    if (err.code === 'SESSION_EXPIRED' || err.message === 'SESSION_EXPIRED' || (err.message && err.message.includes('SESSION_EXPIRED'))) {
      handleSessionExpired();
      return;
    }
    console.error('Error loading app data:', err);
    if (!navigator.onLine) {
      toast('You are offline. Showing cached information.', 'err');
    }
  }
}

/* ============ Polling & Session Handling ============ */
let pollTimer = null;
let isPolling = false;

function startPolling() {
  stopPolling();
  if (!CURRENT_USER) return;
  pollTimer = setInterval(async () => {
    if (document.visibilityState !== 'visible' || S.isSubmitting || S.modal || isPolling || !CURRENT_USER) {
      return;
    }
    const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    const isFormRoute = (p[0] === 'farmer' && p[1] === 'add') || (p[0] === 'buyer' && p[1] === 'post') || p[1] === 'login';
    const activeTag = document.activeElement ? document.activeElement.tagName : '';
    const isTyping = ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeTag);

    isPolling = true;
    try {
      await reloadAppData();
      if (!isFormRoute && !isTyping && !S.isSubmitting && !S.modal && CURRENT_USER) {
        render();
      }
    } catch(e) {
      if (e.code === 'SESSION_EXPIRED' || e.message === 'SESSION_EXPIRED' || (e.message && e.message.includes('SESSION_EXPIRED'))) {
        handleSessionExpired();
      }
    } finally {
      isPolling = false;
    }
  }, 10000);
}

function stopPolling() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
  isPolling = false;
}

function handleSessionExpired(seq) {
  if (seq && seq !== authSeq) return;
  stopPolling();
  window.DFApi.clearToken();
  CURRENT_USER = null;
  currentAuthState = AUTH_STATE.SESSION_EXPIRED;
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (p[0] === 'farmer' || p[0] === 'buyer') {
    go('#/' + p[0] + '/login');
    toast('Your session expired. Please log in again.', 'err');
  } else {
    render();
  }
}

window.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && CURRENT_USER && !S.isSubmitting && !S.modal && !isPolling) {
    const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    const isFormRoute = (p[0] === 'farmer' && p[1] === 'add') || (p[0] === 'buyer' && p[1] === 'post') || p[1] === 'login';
    const activeTag = document.activeElement ? document.activeElement.tagName : '';
    const isTyping = ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeTag);

    reloadAppData().then(() => {
      if (!isFormRoute && !isTyping && !S.isSubmitting && !S.modal && CURRENT_USER) {
        render();
      }
    }).catch(e => {
      if (e.code === 'SESSION_EXPIRED' || e.message === 'SESSION_EXPIRED' || (e.message && e.message.includes('SESSION_EXPIRED'))) {
        handleSessionExpired();
      }
    });
  }
});

/* ============ Router & Lifecycle ============ */
function render() {
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const u = CURRENT_USER;
  const a = p[0], b = p[1];
  let body = '', hideFooter = false;

  if (a === 'farmer' || a === 'buyer') {
    if (b === 'login') {
      if (u && u.role === a) return go('#/' + a);
      if (u && u.role !== a) {
        stopPolling();
        window.DFApi.clearToken();
        CURRENT_USER = null;
        currentAuthState = AUTH_STATE.UNAUTHENTICATED;
      }
      body = authPage(a);
      hideFooter = true;
    } else if (currentAuthState === AUTH_STATE.INITIALIZING) {
      body = `<main class="dash" style="display:flex;justify-content:center;align-items:center;min-height:50vh">
        <div style="text-align:center">
          <span class="spinner" style="width:36px;height:36px;border-width:3px"></span>
          <p class="sub" style="margin-top:14px">Loading DirectFarm...</p>
        </div>
      </main>`;
    } else if (!u) {
      return go('#/' + a + '/login');
    } else {
      body = a === 'farmer' ? farmerApp(u, b || 'overview') : buyerApp(u, b || 'market');
    }
  } else {
    body = landing();
  }

  $('#app').innerHTML = navbar(u) + body + (hideFooter ? '' : footer()) + modalHTML();
  document.title = 'DirectFarm – From farm to buyer, direct and fair';
  document.body.classList.toggle('has-dock', Boolean(u && (a === 'farmer' || a === 'buyer') && b !== 'login'));

  if (S.modal && S.modal.type === 'buy') updBuy(S.modal.id);
  if (a === 'farmer' && b === 'add') {
    onCrop();
    updPreviewCard();
  }

  document.querySelectorAll('.count').forEach(el => {
    const to = +el.dataset.to, t0 = performance.now(), dur = matchMedia('(prefers-reduced-motion:reduce)').matches ? 0 : 1100;
    const tick = t => {
      const k = dur ? Math.min(1, (t - t0) / dur) : 1;
      el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))).toLocaleString('en-IN');
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

window.addEventListener('hashchange', () => {
  S.modal = null;
  stopPolling();
  render();
  if (CURRENT_USER) {
    startPolling();
  }
  window.scrollTo(0, 0);
});

/* ============ App Initialization ============ */
(async function init() {
  const seq = ++authSeq;
  currentAuthState = AUTH_STATE.INITIALIZING;

  render();

  try {
    const user = await window.DFApi.me();
    if (seq !== authSeq) return;
    CURRENT_USER = user;
    currentAuthState = user ? AUTH_STATE.AUTHENTICATED : AUTH_STATE.UNAUTHENTICATED;
  } catch(e) {
    if (seq !== authSeq) return;
    if (e.code === 'SESSION_EXPIRED' || e.message === 'SESSION_EXPIRED' || (e.message && e.message.includes('SESSION_EXPIRED'))) {
      currentAuthState = AUTH_STATE.SESSION_EXPIRED;
      handleSessionExpired(seq);
      return;
    }
    console.warn('Initial session check (keeping session if token present):', e);
    currentAuthState = window.DFApi.getToken() ? AUTH_STATE.AUTHENTICATED : AUTH_STATE.UNAUTHENTICATED;
  }

  try {
    await reloadAppData();
  } catch(e) {
    console.warn('Initial reloadAppData error:', e);
  }

  if (seq !== authSeq) return;
  render();
  if (CURRENT_USER) {
    startPolling();
  }
})();
</script>
</body>
