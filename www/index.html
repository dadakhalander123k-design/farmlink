function detectBuyGpsLocation(listingId) {
  if (!navigator.geolocation) {
    toast('Geolocation is not supported by your browser', 'err');
    return;
  }
  const btn = $('#b_gps_btn');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner" style="width:12px;height:12px;border-width:2px;display:inline-block"></span> Locating...`;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const closest = findClosestTown(lat, lng);
      S.buyDetectedLoc = { lat, lng, nearestTown: closest.n, isGps: true };
      const sel = $('#b_dest');
      if (sel) sel.value = closest.n;
      updateBuyLocBadge();
      updBuy(listingId);
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `${ic('map-pin', 13)} GPS Set`;
      }
      toast(`Delivery pin set: ${closest.n} (${lat.toFixed(4)}, ${lng.toFixed(4)})`, 'ok');
    },
    err => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `${ic('map-pin', 13)} Use GPS`;
      }
      toast('Could not detect GPS: ' + (err.message || 'Permission denied'), 'err');
    },

  );

function updateBuyLocBadge() {
  const badge = $('#b_dest_badge');
  if (!badge) return;
  if (S.buyDetectedLoc) {
    badge.innerHTML = `<span style="color:var(--burgundy);font-weight:600">📍 Exact Order GPS: ${S.buyDetectedLoc.lat.toFixed(4)}, ${S.buyDetectedLoc.lng.toFixed(4)}</span>`;
  } else if (CURRENT_USER && CURRENT_USER.loc && CURRENT_USER.loc.isGps && $('#b_dest') && $('#b_dest').value === CURRENT_USER.loc.label) {
    badge.innerHTML = `<span style="color:var(--burgundy);font-weight:600">📍 Using Buyer GPS Profile (${CURRENT_USER.loc.lat.toFixed(4)}, ${CURRENT_USER.loc.lng.toFixed(4)})</span>`;
  } else {
    badge.innerHTML = `<span style="color:var(--ink2)">Selected from regional hub list.</span>`;
  }

function updBuy(id) {
  const l = ACTIVE_LISTINGS.find(x => x.id === id);
  if (!l || !$('#b_qty')) return;
  const q = Math.max(0, Math.min(l.qty, parseFloat($('#b_qty').value) || 0));
  const dest = getBuyDestLoc();
  const fee = deliveryFee(l.loc, dest);
  $('#b_sum').innerHTML = `<div class="row"><span>${q} kg × ${inr(l.price)}</span><span>${inr(q * l.price)}</span></div><div class="row"><span>Delivery (${Math.round(km(l.loc, dest))} km)</span><span>${inr(fee)}</span></div><div class="row t"><span>Total payable</span><span>${inr(q * l.price + fee)}</span></div>`;
}

async function placeOrder(id) {
  if (S.isSubmitting) return;
  if (!CURRENT_USER) {
    go('#/buyer/login');
    return toast('Please log in to place an order.', 'err');
  }
  const token = (typeof localStorage !== 'undefined' && localStorage.getItem('df_buyer_token')) || window.DFApi.getToken();
  if (!token) {
    return handleSessionExpired();
  }

  const l = ACTIVE_LISTINGS.find(x => x.id === id);
  const q = parseFloat($('#b_qty').value);
  if (!l || l.status !== 'active') return toast('This produce is no longer available.', 'err');
  if (!(q >= 1) || q > l.qty) return toast(`Choose between 1 and ${l.qty} kg.`, 'err');

  S.isSubmitting = true;
  const btn = $('#orderBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Processing order...`; }

  try {
    const dest = getBuyDestLoc();
    const ordId = await window.DFApi.placeOrder({
      token,
      listingId: l.id,
      qty: q,
      dest,
      address: $('#b_addr').value.trim(),
      pay: $('#b_pay').value
    });

    if (ordId && l && l.loc) {
      try {
        localStorage.setItem('df_order_farmer_loc_' + ordId, JSON.stringify({
          label: l.loc.label ? `${l.loc.label} Farm (${(l.farmer && l.farmer.org) || 'Farmer'})` : 'Farmer Farm',
          lat: Number(l.loc.lat),
          lng: Number(l.loc.lng)
        }));
      } catch(e) {}
    }

    S.modal = null;
    toast('Order placed successfully! Decremented in database.');
    await reloadAppData();
    go('#/buyer/orders');
  } catch(e) {
    toast(e.message || 'Failed to place order.', 'err');
    await reloadAppData();
    render();
  } finally {
    S.isSubmitting = false;
    if (btn) { btn.disabled = false; btn.textContent = 'Place direct order'; }
  }
}

async function sendOffer(rid) {
  const r = OPEN_REQS.find(x => x.id === rid);
  const l = MY_LISTINGS.find(x => x.id === $('#o_l').value);
  const q = parseFloat($('#o_qty').value);
  const p = parseFloat($('#o_price').value);

  if (!l) return toast('Select a valid listing.', 'err');
  if (!(q > 0) || q > l.qty) return toast(`Offer quantity must be between 1 and ${l.qty} kg.`, 'err');
  if (!(p > 0)) return toast('Enter your price per kg.', 'err');

  try {
    await window.DFApi.createOffer({
      reqId: rid,
      listingId: l.id,
      qty: q,
      price: p,
      delivery: $('#o_del').value === '1'
    });

    S.modal = null;
    toast('Offer sent to ' + r.buyerOrg);
    await reloadAppData();
    render();
  } catch(e) {
    toast(e.message || 'Failed to send offer.', 'err');
    await reloadAppData();
    render();
  }
}

/* ============ Data Synchronization ============ */
async function reloadAppData() {
  try {
    PUBLIC_STATS = await window.DFApi.publicStats();
    ACTIVE_LISTINGS = await window.DFApi.listListings((LISTINGS_PAGE + 1) * PAGE_SIZE, 0);
    HAS_MORE_LISTINGS = ACTIVE_LISTINGS.length >= (LISTINGS_PAGE + 1) * PAGE_SIZE;

    if (CURRENT_USER) {
      if (CURRENT_USER.role === 'farmer') {
        MY_LISTINGS = await window.DFApi.myListings();
        MY_ORDERS = await window.DFApi.myOrders();
        OPEN_REQS = await window.DFApi.listOpenRequirements();
        MY_OFFERS = await window.DFApi.myOffers();
      } else {
        MY_ORDERS = await window.DFApi.myOrders();
        MY_REQS = await window.DFApi.myRequirements();
        MY_OFFERS = await window.DFApi.myOffers();
      }
    }
  } catch(err) {
    if (err.code === 'SESSION_EXPIRED' || err.message === 'SESSION_EXPIRED' || (err.message && err.message.includes('SESSION_EXPIRED'))) {
      handleSessionExpired();
      return;
    }
    console.error('Error loading app data:', err);
    if (!navigator.onLine) {
      toast('You are offline. Showing cached information.', 'err');
    }
  }
}

/* ============ Polling & Session Handling ============ */
let pollTimer = null;
let isPolling = false;

function getAppDataSnapshot() {
  const oStr = (MY_ORDERS || []).map(o => o.id + ':' + o.status).join(',');
  const lCount = (ACTIVE_LISTINGS || []).length;
  const myLStr = (MY_LISTINGS || []).map(l => l.id + ':' + l.qty).join(',');
  const reqStr = (OPEN_REQS || []).map(r => r.id + ':' + (r.filled || 0)).join(',');
  const offStr = (MY_OFFERS || []).map(o => o.id + ':' + o.status).join(',');
  return `${oStr}|${lCount}|${myLStr}|${reqStr}|${offStr}`;
}

function startPolling() {
  stopPolling();
  if (!CURRENT_USER) return;
  // Step 4: Relaxed 30-second interval (down from frantic 10s) to keep app buttery smooth
  pollTimer = setInterval(async () => {
    if (document.visibilityState !== 'visible' || S.isSubmitting || S.modal || isPolling || !CURRENT_USER) {
      return;
    }
    const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    const isFormRoute = (p[0] === 'farmer' && p[1] === 'add') || (p[0] === 'buyer' && p[1] === 'post') || p[1] === 'login' || p[1] === 'track';
    const activeTag = document.activeElement ? document.activeElement.tagName : '';
    const isTyping = ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeTag);
    // Step 3: Pause auto-refresh while user is actively viewing/interacting with an expanded order card
    const hasOpenAccordion = S.fExpandedOrders && S.fExpandedOrders.size > 0;

    isPolling = true;
    try {
      // Step 1: Smart Data Diffing - compare snapshot before and after reload
      const prevSnapshot = getAppDataSnapshot();
      await reloadAppData();
      const newSnapshot = getAppDataSnapshot();
      const dataChanged = prevSnapshot !== newSnapshot;

      // Only re-render if data actually changed AND no accordion is currently open
      if (dataChanged && !hasOpenAccordion && !isFormRoute && !isTyping && !S.isSubmitting && !S.modal && CURRENT_USER) {
        render();
      }
    } catch(e) {
      if (e.code === 'SESSION_EXPIRED' || e.message === 'SESSION_EXPIRED' || (e.message && e.message.includes('SESSION_EXPIRED'))) {
        handleSessionExpired();
      }
    } finally {
      isPolling = false;
    }
  }, 30000);
}

function stopPolling() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
  isPolling = false;
}

function handleSessionExpired(seq) {
  if (seq && seq !== authSeq) return;
  stopPolling();
  window.DFApi.clearToken();
  CURRENT_USER = null;
  currentAuthState = AUTH_STATE.SESSION_EXPIRED;
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (p[0] === 'farmer' || p[0] === 'buyer') {
    go('#/' + p[0] + '/login');
    toast('Your session expired. Please log in again.', 'err');
  } else {
    render();
  }
}

window.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && CURRENT_USER && !S.isSubmitting && !S.modal && !isPolling) {
    const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    const isFormRoute = (p[0] === 'farmer' && p[1] === 'add') || (p[0] === 'buyer' && p[1] === 'post') || p[1] === 'login';
    const activeTag = document.activeElement ? document.activeElement.tagName : '';
    const isTyping = ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeTag);
    const hasOpenAccordion = S.fExpandedOrders && S.fExpandedOrders.size > 0;

    const prevSnapshot = getAppDataSnapshot();
    reloadAppData().then(() => {
      const dataChanged = prevSnapshot !== getAppDataSnapshot();
      if (dataChanged && !hasOpenAccordion && !isFormRoute && !isTyping && !S.isSubmitting && !S.modal && CURRENT_USER) {

/* ============ App Initialization ============ */
(async function init() {
  const seq = ++authSeq;
  currentAuthState = AUTH_STATE.INITIALIZING;

  render();

  try {
    const user = await window.DFApi.me();
    if (seq !== authSeq) return;
    CURRENT_USER = applyUserLocOverride(user);
    currentAuthState = user ? AUTH_STATE.AUTHENTICATED : AUTH_STATE.UNAUTHENTICATED;
  } catch(e) {
    if (seq !== authSeq) return;
    if (e.code === 'SESSION_EXPIRED' || e.message === 'SESSION_EXPIRED' || (e.message && e.message.includes('SESSION_EXPIRED'))) {
      currentAuthState = AUTH_STATE.SESSION_EXPIRED;
      handleSessionExpired(seq);
      return;
    }
    console.warn('Initial session check (keeping session if token present):', e);
    currentAuthState = window.DFApi.getToken() ? AUTH_STATE.AUTHENTICATED : AUTH_STATE.UNAUTHENTICATED;
  }

  try {
    await reloadAppData();
  } catch(e) {
    console.warn('Initial reloadAppData error:', e);
  }

  if (seq !== authSeq) return;
  render();
  if (CURRENT_USER) {
    startPolling();
  }

  // Pre-load official AGMARKNET filters in background
  fetch('/api/market-prices/filters').then(r => r.json()).then(f => {
    if (f && f.success) {
      AVAILABLE_COMMODITIES = f.commodities || [];
      AVAILABLE_STATES = f.states || [];
    }
  }).catch(() => {});
})();
