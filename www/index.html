<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  try {
    var t = localStorage.getItem('df_theme');
    if (t === 'dark') {
      localStorage.removeItem('df_theme');
      t = 'light';
    }
    document.documentElement.setAttribute('data-theme', t || 'light');
  } catch(e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farmlink – From farm to buyer, direct and fair</title>
<link rel="icon" type="image/png" href="assets/images/farmfinal.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root{
  /* Global Theme Tokens: Cosmic Latte (#B7A89A), Deep Burgundy (#722F37) & Mocha Cream (#E8DCC6) */
  --df-cosmic-latte: #B7A89A;
  --df-deep-burgundy: #722F37;
  --df-mocha-cream: #E8DCC6;

  /* Sophisticated Warm Cream Tonal Hierarchy */
  --bg: #E8DCC6;              /* True Mocha Cream page background */
  --bg-subtle: #DECDB3;       /* Refined deeper Mocha Cream for sections, stats & tables */
  --card: #F5EBDC;            /* Light warm cream surface for cards & panels */
  --card-elevated: #FFFDFC;   /* Pristine ivory cream elevated surface for modals & dropdowns */

  --latte: #B7A89A;           /* Cosmic Latte primary neutral accent, secondary surfaces & borders */
  --latte-hover: #A69585;     /* Cosmic Latte interactive hover */
  --latte-light: #DDD4CB;     /* Lighter Cosmic Latte variation */
  --latte-dark: #6C5B4E;      /* Deeper warm bronze-espresso variation of Cosmic Latte */

  --burgundy: #722F37;        /* Deep Burgundy primary accent, CTAs, headings & active states */
  --burgundy-hover: #5A252C;  /* Deep Burgundy hover */
  --burgundy-light: #8E3B45;  /* Deep Burgundy light accent */
  --burgundy-soft: rgba(114,47,55,0.12);

  --ink: #2A2118;             /* Deep warm charcoal text primary */
  --ink2: #5D4F42;            /* Muted warm gray text secondary */
  --ink3: #8C7B6D;            /* Soft taupe text muted */

  /* Action & Interactive Accents - Deep Burgundy #722F37 based */
  --olive: #722F37;           /* Deep Burgundy for primary buttons & active items */
  --olive2: #5A252C;          /* Deep Burgundy hover */
  --olive-light: rgba(114,47,55,0.12); /* Deep Burgundy soft container */
  --onolive: #FFFDFC;         /* Crisp light cream text on Deep Burgundy buttons */

  /* Semantic Status Tokens */
  --green: #35632F;
  --amber: #8F6216;
  --terra: #722F37;

  /* Fine Borders & Warm Depth */
  --line: rgba(183,168,154,0.65);
  --line-strong: #722F37;
  --soft: rgba(183,168,154,0.22);
  --soft-hover: rgba(183,168,154,0.36);
  --shadow-sm: 0 2px 8px rgba(42,33,24,0.06);
  --shadow: 0 8px 24px rgba(42,33,24,0.08);
  --shadow-lg: 0 16px 40px rgba(42,33,24,0.12);
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Plus Jakarta Sans', 'Figtree', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}

:root[data-theme="dark"]{
  --bg: #2B181B;
  --bg-subtle: #241416;
  --card: #381E23;
  --card-elevated: #46252B;
  --latte: #B7A89A;
  --latte-hover: #C5B9AE;
  --latte-light: #E8DCC6;
  --latte-dark: #D4C9BF;
  --burgundy: #B24E5B;
  --burgundy-hover: #C65A68;
  --burgundy-light: #E89CA7;
  --ink: #F7F3EC;
  --ink2: #D1C4B5;
  --ink3: #A09080;
  --olive: #B24E5B;
  --olive2: #C65A68;
  --olive-light: #46252B;
  --onolive: #FFFDFC;
  --green: #7BB86A;
  --amber: #E8B455;
  --terra: #E67A64;
  --line: rgba(183,168,154,0.35);
  --line-strong: rgba(183,168,154,0.65);
  --soft: rgba(183,168,154,0.18);
  --soft-hover: rgba(183,168,154,0.28);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
  --shadow: 0 8px 24px rgba(0,0,0,0.3);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.4);
  color-scheme: dark;
}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15.5px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
h1,h2,h3,h4{
  font-family:var(--serif);
  font-weight:600;
  line-height:1.15;
  margin:0;
  letter-spacing:-.015em;
  color:var(--burgundy);
}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
img,svg{max-width:100%;height:auto}
:focus-visible{outline:3px solid var(--burgundy);outline-offset:2px;border-radius:10px}
.ic{flex:none;vertical-align:middle}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}

/* ==================== Navigation ==================== */
.nav{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:100;
  display:flex;
  align-items:center;
  gap:20px;
  padding:14px max(24px,calc((100% - 1200px)/2));
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--latte);
  box-shadow:0 2px 14px rgba(183,168,154,0.18);
  transition:border-color .2s,background .2s;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-family:var(--serif);
  font-weight:700;
  font-size:22px;
  color:var(--burgundy);
  letter-spacing:-.01em;
}
.brand svg, .brand img, .brand-logo-img{width:36px;height:36px;object-fit:contain;flex:none}
.nav-links{display:flex;align-items:center;gap:4px;margin-left:14px}
.nav-links a{
  padding:8px 14px;
  border-radius:12px;
  color:var(--ink);
  font-weight:600;
  font-size:14.5px;
  transition:background .18s,color .18s,border-color .18s;
  cursor:pointer;
  border:1px solid transparent;
}
.nav-links a:hover{background:var(--soft);color:var(--burgundy);border-color:var(--latte)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative}
.theme-btn{
  border:1px solid var(--latte);
  background:var(--card);
  color:var(--burgundy);
  width:40px;
  height:40px;
  border-radius:12px;
  display:grid;
  place-items:center;
  transition:background .18s,border-color .18s,transform .18s;
}
.theme-btn:hover{background:var(--soft);transform:scale(1.04);border-color:var(--burgundy)}
.nav-menu2-btn{
  border:1px solid var(--latte);
  background:var(--card);
  color:var(--burgundy);
  width:40px;
  height:40px;
  border-radius:12px;
  display:grid;
  place-items:center;
  cursor:pointer;
  transition:background .18s,border-color .18s,transform .18s;
  box-shadow:var(--shadow-sm);
  flex:none;
}
.nav-menu2-btn:hover{background:var(--soft);transform:scale(1.04);border-color:var(--burgundy)}
.nav-menu-dropdown{
  position:absolute;
  left:0;
  top:calc(100% + 10px);
  min-width:210px;
  max-height:calc(100vh - 80px);
  overflow-y:auto;
  background:var(--card-elevated);
  border:1px solid var(--latte);
  border-radius:18px;
  box-shadow:var(--shadow-lg);
  padding:8px;
  display:none;
  flex-direction:column;
  gap:4px;
  z-index:120;
}
.nav-menu-dropdown.open{display:flex;animation:pop .18s cubic-bezier(.16,1,.3,1)}
.nav-menu-dropdown a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  border-radius:12px;
  color:var(--ink);
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  transition:background .15s,color .15s;
  text-decoration:none;
}
.nav-menu-dropdown a:hover{background:var(--soft);color:var(--burgundy)}
.nav-menu-dropdown a.on{
  background:color-mix(in srgb, var(--burgundy) 10%, transparent);
  color:var(--burgundy);
  font-weight:700;
}
.nav-menu-dropdown a .cnt{
  margin-left:auto;
  background:var(--burgundy);
  color:var(--onolive);
  font-size:11px;
  font-weight:700;
  padding:2px 7px;
  border-radius:999px;
}
.profile-btn{
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid var(--latte);
  background:var(--card);
  color:var(--burgundy);
  padding:5px 14px 5px 6px;
  border-radius:14px;
  box-shadow:var(--shadow-sm);
  transition:border-color .18s,box-shadow .18s;
}
.profile-btn:hover{border-color:var(--burgundy);box-shadow:var(--shadow)}
.avatar{
  width:32px;
  height:32px;
  border-radius:10px;
  background:var(--burgundy);
  color:var(--onolive);
  display:grid;
  place-items:center;
  font-weight:700;
  font-size:14px;
  font-family:var(--sans);
  border:1px solid var(--burgundy-hover);
}
.role-tag{
  font-size:11.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  padding:3px 9px;
  border-radius:8px;
  background:var(--bg-subtle);
  color:var(--burgundy);
  border:1px solid var(--latte);
}
.menu{
  position:absolute;
  right:0;
  top:calc(100% + 12px);
  width:min(320px,88vw);
  background:var(--card-elevated);
  border:1px solid var(--latte);
  border-radius:20px;
  box-shadow:var(--shadow-lg);
  padding:10px;
  display:none;
  z-index:120;
}
.menu.open{display:block;animation:pop .18s cubic-bezier(.16,1,.3,1)}
.menu .who{padding:12px 14px 14px;border-bottom:1px solid var(--soft);margin-bottom:6px}
.menu .who b{display:block;font-size:17px;font-family:var(--serif);color:var(--burgundy)}
.menu .who span{color:var(--ink2);font-size:13.5px;display:block;margin-top:2px}
.menu a,.menu button{
  display:flex;
  gap:10px;
  align-items:center;
  width:100%;
  padding:10px 14px;
  border:0;
  background:none;
  color:var(--ink);
  border-radius:12px;
  text-align:left;
  font-weight:600;
  font-size:14.5px;
  transition:background .15s;
}
.menu a:hover,.menu button:hover{background:var(--soft);color:var(--burgundy)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}

/* ==================== Buttons & Chips ==================== */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:11px 22px;
  border-radius:12px;
  border:1px solid transparent;
  font-weight:600;
  font-size:15px;
  text-decoration:none;
  transition:transform .15s,box-shadow .15s,background .15s,border-color .15s;
  white-space:nowrap;
  line-height:1.2;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{
  background:var(--burgundy);
  color:var(--onolive);
  border:1px solid var(--burgundy-hover);
  box-shadow:0 4px 14px rgba(114,47,55,.35);
  font-weight:700;
}
.btn-primary:hover{
  background:var(--burgundy-hover);
  color:var(--onolive);
  border-color:var(--burgundy-hover);
  box-shadow:0 6px 18px rgba(114,47,55,.48);
}
.btn-secondary{
  background:var(--latte);
  color:var(--ink);
  border:1px solid var(--latte-dark);
  font-weight:600;
}
.btn-secondary:hover{background:var(--latte-hover);border-color:var(--latte-dark)}
.btn-ghost{
  background:transparent;
  border:1px solid var(--burgundy);
  color:var(--burgundy);
  font-weight:600;
}
.btn-ghost:hover{background:var(--burgundy);color:var(--onolive)}
.btn-light{
  background:var(--card);
  border:1px solid var(--latte);
  color:var(--burgundy);
  font-weight:600;
}
.btn-light:hover{background:var(--soft);border-color:var(--burgundy)}
.btn-lg{padding:14px 28px;font-size:16px;border-radius:14px}
.btn-sm{padding:7px 15px;font-size:13.5px;border-radius:10px}
.btn-danger{
  background:transparent;
  border-color:var(--terra);
  color:var(--terra);
}
.btn-danger:hover{background:color-mix(in srgb,var(--terra) 12%,transparent)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* ==================== Hero Section ==================== */
.hero{
  position:relative;
  padding:48px 0 64px;
  overflow:hidden;
  background:var(--bg);
}
.hero-grid{
  display:grid;
  grid-template-columns:1.15fr 0.95fr;
  gap:40px;
  align-items:center;
}
@media (max-width:960px){
  .hero-grid{grid-template-columns:1fr;gap:36px}
}
.hero-content{
  display:flex;
  flex-direction:column;
  gap:20px;
  max-width:620px;
}
.hero-chip{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--card);
  border:1px solid var(--burgundy);
  color:var(--burgundy);
  padding:6px 14px;
  border-radius:999px;
  font-weight:700;
  font-size:13px;
  width:fit-content;
  box-shadow:var(--shadow-sm);
}
.hero h1{
  font-size:clamp(36px,5.2vw,62px);
  line-height:1.08;
  letter-spacing:-.02em;
  color:var(--burgundy);
}
.hero p.lead{
  font-size:clamp(16px,1.9vw,19px);
  line-height:1.55;
  color:var(--ink2);
}
.hero .cta{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:8px;
}
.hero-trust{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  margin-top:12px;
  color:var(--ink2);
  font-size:13.5px;
  font-weight:600;
}
.hero-trust span{display:flex;align-items:center;gap:6px}
.hero-trust svg{color:var(--latte-dark)}

.hero-visual{
  position:relative;
  border-radius:24px;
  overflow:visible;
}
.hero-img-wrap{
  position:relative;
  border-radius:24px;
  overflow:hidden;
  border:1px solid var(--latte);
  box-shadow:var(--shadow-lg);
  aspect-ratio:4/3;
  background:var(--card);
}
.hero-img-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .4s cubic-bezier(.16,1,.3,1);
}
.hero-img-wrap:hover img{transform:scale(1.02)}
.float-chip{
  position:absolute;
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--card-elevated);
  color:var(--ink);
  padding:12px 18px;
  border-radius:18px;
  border:1px solid var(--latte);
  font-weight:700;
  font-size:14px;
  box-shadow:var(--shadow-lg);
  animation:bob 6s ease-in-out infinite;
  z-index:2;
}
.float-chip small{display:block;font-weight:500;color:var(--ink2);font-size:12px;margin-top:2px}
.float-chip .dot{
  width:36px;
  height:36px;
  border-radius:10px;
  background:var(--burgundy);
  color:var(--onolive);
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid var(--burgundy-hover);
}
.fc1{left:-16px;top:14%;animation-delay:0s}
.fc2{right:-16px;bottom:18%;animation-delay:-2.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (max-width:960px){
  .float-chip{
    display:flex;
    padding:8px 12px;
    font-size:12px;
    border-radius:14px;
    gap:8px;
    max-width:calc(100% - 20px);
    animation:none;
  }
  .float-chip .dot{width:28px;height:28px}
  .float-chip small{display:none}
  .fc1{left:10px;top:10px}
  .fc2{right:10px;bottom:10px}
}
@media (max-width:768px){
  .hero-img-wrap{
    aspect-ratio:16/9;
    border-radius:18px;
  }
  .hero-img-wrap img{
    image-rendering:-webkit-optimize-contrast;
  }
}

/* ==================== Stats Bar ==================== */
.stats-band{
  background:var(--bg-subtle);
  border-top:1px solid var(--latte);
  border-bottom:1px solid var(--latte);
  margin:20px 0 0;
}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  max-width:1200px;
  margin:0 auto;
}
.stat{
  padding:28px 24px;
  border-right:1px solid var(--latte);
}
.stat:last-child{border-right:0}
.stat b{
  display:block;
  font-family:var(--serif);
  font-size:clamp(30px,3.8vw,44px);
  font-weight:600;
  line-height:1;
  color:var(--burgundy);
}
.stat span{
  color:var(--ink2);
  font-size:14px;
  font-weight:600;
  margin-top:8px;
  display:block;
}
@media (max-width:760px){
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--latte)}
}

/* ==================== General Sections ==================== */
section.s{padding:76px 0}
.s-head{max-width:680px;margin-bottom:36px}
.s-head .kicker{
  color:var(--burgundy);
  font-weight:700;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:8px;
}
.s-head h2{font-size:clamp(28px,3.6vw,44px);color:var(--burgundy)}
.s-head p{color:var(--ink2);margin-top:12px;font-size:17px;line-height:1.55}
.alt{background:color-mix(in srgb,var(--bg-subtle) 60%,var(--bg))}

/* Category Row */
.cat-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:14px;
}
@media (max-width:1100px){.cat-grid{grid-template-columns:repeat(4,1fr)}}
@media (max-width:760px){.cat-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.cat-grid{grid-template-columns:repeat(2,1fr)}}
.cat-card{
  background:var(--card);
  border:1px solid var(--latte);
  border-radius:18px;
  overflow:hidden;
  padding:0;
  display:flex;
  flex-direction:column;
  text-align:left;
  transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s,border-color .2s;
  cursor:pointer;
  color:inherit;
}
.cat-card:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow);
  border-color:var(--latte-dark);
}
.cat-card .cat-img{
  height:120px;
  overflow:hidden;
  background:var(--bg-subtle);
  border-bottom:1px solid var(--latte);
}
.cat-card .cat-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .4s cubic-bezier(.16,1,.3,1);
}
.cat-card:hover .cat-img img{transform:scale(1.06)}
.cat-card .cat-info{
  padding:12px 14px;
  display:flex;
  flex-direction:column;
}
.cat-card b{font-size:15px;color:var(--ink)}
.cat-card span{font-size:12.5px;color:var(--ink2);margin-top:2px}

/* Direct Farm-to-Buyer Story Visuals */
.story-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}
@media (max-width:860px){
  .story-grid{grid-template-columns:1fr;gap:18px}
}
.story-card{
  background:var(--card);
  border:1px solid var(--latte);
  border-radius:20px;
  overflow:hidden;
  box-shadow:var(--shadow-sm);
  transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s cubic-bezier(.16,1,.3,1),border-color .25s;
  display:flex;
  flex-direction:column;
}
.story-card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
  border-color:var(--latte-dark);
}
.story-media{
  position:relative;
  height:190px;
  overflow:hidden;
  background:var(--bg-subtle);
}
.story-media img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .4s cubic-bezier(.16,1,.3,1);
}
.story-card:hover .story-media img{
  transform:scale(1.03);
}
.story-tag{
  position:absolute;
  left:14px;
  top:14px;
  background:rgba(42,33,24,0.72);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  color:#E8DCC6;

/* Supply Chain */
.chain{display:grid;gap:16px}
.chain-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  padding:20px 24px;
  border-radius:18px;
  border:1px solid var(--latte);
  background:var(--card);
}
.chain-row .node{
  padding:8px 16px;
  border-radius:10px;
  font-weight:600;
  font-size:14.5px;
  background:var(--bg-subtle);
  border:1px solid var(--latte);
  color:var(--ink);
}
.chain-row .sep{color:var(--latte-dark)}
.chain-row.old{opacity:.75}
.chain-row.old .node:not(:first-child){text-decoration:line-through;text-decoration-color:var(--terra)}
.chain-row.new{
  background:var(--bg-subtle);
  color:var(--ink);
  border-color:var(--latte-dark);
  box-shadow:0 4px 16px rgba(183,168,154,.25);
}
.chain-row.new .node{background:var(--card);color:var(--ink);border:1px solid var(--latte-dark)}
.chain-row.new .sep{color:var(--latte-dark)}
.chain-note{color:var(--ink2);font-size:14px;font-weight:600;margin-left:auto}
.chain-row.new .chain-note{color:var(--ink)}

/* Roles */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:860px){.roles{grid-template-columns:1fr}}
.role{
  border-radius:24px;
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--latte);
  display:flex;
  flex-direction:column;
  box-shadow:var(--shadow-sm);
  transition:border-color .2s,box-shadow .2s;
}
.role:hover{border-color:var(--latte-dark);box-shadow:var(--shadow)}
.role .role-photo{
  height:220px;
  position:relative;
  overflow:hidden;
  background:var(--bg-subtle);
}
.role .role-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  opacity:.9;
  transition:transform .4s;
}
.role:hover .role-photo img{transform:scale(1.03)}
.role .role-photo::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(42,33,24,.6) 100%);
}
.role-photo .role-pill{
  position:absolute;
  left:20px;
  bottom:16px;
  background:var(--card-elevated);
  color:var(--ink);
  font-weight:700;
  font-size:13px;
  padding:5px 12px;
  border-radius:8px;
  z-index:2;
  border:1px solid var(--latte);
}
.role .body{
  padding:28px;
  display:flex;
  flex-direction:column;
  gap:12px;
  flex:1;
}
.role h3{font-size:26px}
.role ul{margin:4px 0 12px;padding-left:20px;color:var(--ink2)}
.role ul li{margin:6px 0;font-size:15px}
.role .btn{align-self:flex-start;margin-top:auto}

/* Features Grid */
.feat{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0;
  border:1px solid var(--latte);
  border-radius:22px;
  overflow:hidden;
  background:var(--card);
}
.feat > div{
  padding:32px 28px;
  border-right:1px solid var(--latte);
  border-bottom:1px solid var(--latte);
}
.feat > div:nth-child(3n){border-right:0}
.feat > div:nth-last-child(-n+3){border-bottom:0}
.feat .ficon{
  width:44px;
  height:44px;
  border-radius:12px;
  background:var(--bg-subtle);
  color:var(--ink);
  display:grid;
  place-items:center;
  margin-bottom:16px;
  border:1px solid var(--latte);
}
.feat h3{font-size:20px;margin-bottom:8px}
.feat p{color:var(--ink2);font-size:15px;line-height:1.55}
@media (max-width:960px){
  .feat{grid-template-columns:1fr 1fr}
  .feat > div{border-right:1px solid var(--latte)!important;border-bottom:1px solid var(--latte)!important}
  .feat > div:nth-child(2n){border-right:0!important}
}
@media (max-width:620px){
  .feat{grid-template-columns:1fr}
  .feat > div{border-right:0!important}
}

/* Steps */
.steps{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:20px;
  counter-reset:st;
  position:relative;
}
.step{position:relative}
.step::before{
  counter-increment:st;
  content:counter(st);
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--burgundy);
  color:var(--onolive);
  border:2px solid var(--latte);
  font-family:var(--sans);
  font-weight:700;
  font-size:17px;
  position:relative;
  z-index:1;
  margin-bottom:16px;
  box-shadow:0 4px 12px rgba(114,47,55,0.25);
}
.step h4{font-size:19px;margin:0 0 6px;color:var(--burgundy)}
.step p{color:var(--ink2);font-size:14.5px;line-height:1.5}
@media (max-width:880px){
  .steps{grid-template-columns:1fr;gap:24px}
  .step{padding-left:56px}
  .step::before{position:absolute;left:0;top:0}
}

.cta-band .cta{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}

.cta-band .btn-primary:hover{background:var(--burgundy-hover)}

.pcard{

  transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .22s cubic-bezier(.16,1,.3,1),border-color .22s;

}
.pcard .pic{
  height:145px;

  overflow:hidden;
  background:var(--bg-subtle);
}
.pcard .pic img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .35s cubic-bezier(.16,1,.3,1);
}
.pcard.click:hover .pic img{transform:scale(1.05)}

}

  overflow:hidden;

  flex-direction:column;
}

}
.skeleton-body{
  padding:16px 20px;
  display:grid;
  gap:10px;
  flex:1;
}
.skeleton-line{
  height:14px;
  border-radius:6px;
  background:color-mix(in srgb,var(--soft) 60%,var(--bg-subtle));
  animation:shimmerPulse 1.4s ease-in-out infinite;
}
.skeleton-line.short{width:50%}
.skeleton-line.mid{width:75%}

.dropzone{

  border-radius:18px;
  padding:32px 20px;
  text-align:center;
  background:var(--bg-subtle);
  cursor:pointer;
  transition:border-color .18s,background .18s,transform .18s;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}
.dropzone:hover,.dropzone.dragover{

  border:1px solid var(--latte);
}

.dropzone .dz-hint{font-size:12px;color:var(--ink3)}

.farmer-earnings-receipt{

@media (max-width:860px){
  .order-main-row{
    flex-direction:column;

    gap:14px;
  }
  .order-col-produce, .order-col-status, .order-col-actions{
    width:100%;
    min-width:0;
  }
  .order-col-actions{
    justify-content:space-between;
    border-top:1px solid var(--soft);
    padding-top:12px;
  }
  .order-total-block{
    text-align:left;
  }
}

.orderbox{
  background:var(--card);
  border:1px solid color-mix(in srgb,var(--latte) 50%,transparent);
  border-radius:22px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 4px 20px rgba(0,0,0,0.05);
  transition:box-shadow .2s ease,transform .2s ease;
}
.orderbox:hover{
  box-shadow:0 8px 24px rgba(0,0,0,0.08);
}
.orderbox .top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.timeline{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:0;
  margin:22px 0 16px;
  position:relative;
}
.tl{
  position:relative;
  text-align:center;
  font-size:12.5px;
  color:var(--ink3);
  padding-top:34px;
  font-weight:600;
}
.tl::before{
  content:"";
  position:absolute;
  top:8px;
  left:50%;
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--card);
  border:2.5px solid var(--latte);
  transform:translateX(-50%);
  z-index:2;
  transition:all .25s ease;
}
.tl::after{
  content:"";
  position:absolute;
  top:15px;
  left:-50%;
  width:100%;
  height:3px;
  background:var(--soft);
  z-index:1;
  transition:background .25s ease;
}
.tl:first-child::after{display:none}
.tl.done::before{
  background:var(--green);
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(53,99,47,0.18);
}
.tl.done::after{background:var(--green)}
.tl.now::before{
  background:var(--green);
  border-color:var(--card);
  box-shadow:0 0 0 5px rgba(53,99,47,0.25);
  animation:stepPulse 2s infinite;
}
.tl.done{color:var(--green);font-weight:700}
.tl.now{color:var(--burgundy);font-weight:700}
@keyframes stepPulse{
  0%,100%{box-shadow:0 0 0 4px rgba(53,99,47,0.25)}
  50%{box-shadow:0 0 0 7px rgba(53,99,47,0.4)}
}
.tl-time{
  font-size:11px;
  color:var(--ink2);
  margin-top:4px;
  display:block;
  font-weight:500;
}

/* Status Chips */
.status{font-weight:700;font-size:12.5px;padding:4px 12px;border-radius:8px;display:inline-block;border:1px solid transparent}
.st-placed{background:var(--bg-subtle);border-color:var(--latte);color:#5A4010}
.st-confirmed,.st-preparing{background:color-mix(in srgb,var(--bg-subtle) 75%,var(--green));border-color:color-mix(in srgb,var(--latte) 70%,var(--green));color:var(--green)}
.st-out{background:color-mix(in srgb,var(--latte) 30%,var(--card));border-color:var(--latte);color:var(--ink)}
.st-delivered{background:var(--burgundy);border-color:var(--burgundy-hover);color:var(--onolive)}
.st-cancelled{background:color-mix(in srgb,var(--bg-subtle) 80%,var(--terra));border-color:color-mix(in srgb,var(--latte) 60%,var(--terra));color:var(--terra)}
.st-open{background:color-mix(in srgb,var(--bg-subtle) 75%,var(--green));border-color:color-mix(in srgb,var(--latte) 70%,var(--green));color:var(--green)}
.st-fulfilled{background:var(--burgundy);border-color:var(--burgundy-hover);color:var(--onolive)}
.st-closed{background:var(--soft);border-color:var(--latte);color:var(--ink2)}
.st-pending{background:var(--bg-subtle);border-color:var(--latte);color:#5A4010}
.st-accepted{background:var(--burgundy);border-color:var(--burgundy-hover);color:var(--onolive)}
.st-declined{background:color-mix(in srgb,var(--bg-subtle) 80%,var(--terra));border-color:color-mix(in srgb,var(--latte) 60%,var(--terra));color:var(--terra)}

/* Match & Intelligence Cards */
.ring{
  --p:80;
  width:62px;
  height:62px;
  border-radius:50%;
  background:conic-gradient(var(--burgundy) calc(var(--p)*1%),var(--soft) 0);
  display:grid;
  place-items:center;
  flex:none;
  position:relative;
}
.ring::before{content:"";position:absolute;inset:6px;background:var(--card);border-radius:50%}
.ring span{position:relative;font-weight:700;font-size:14.5px;color:var(--burgundy)}
.mcard{
  display:flex;
  gap:16px;
  align-items:flex-start;
  padding:20px;
  border:1px solid var(--latte);
  border-radius:18px;
  background:var(--card-elevated);
  margin-bottom:14px;
}
.mcard.best{border-color:var(--burgundy);box-shadow:0 0 0 2px rgba(114,47,55,0.35)}
.mcard .info{flex:1;min-width:0}
.mcard h4{font-size:19px;color:var(--burgundy)}
.why{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.why span{font-size:12px;background:var(--soft);padding:3px 9px;border-radius:6px;color:var(--ink);font-weight:600}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--latte),var(--burgundy));border-radius:999px;transition:width .6s}
.note{
  background:var(--bg-subtle);
  border:1px solid var(--latte);
  padding:14px 18px;
  border-radius:14px;
  font-size:14.5px;
  color:var(--ink);
}

/* Forecast Bars */
.fbars{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:end;height:200px;margin:16px 0}
.fb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:13px}
.fb i{display:block;width:100%;max-width:54px;border-radius:10px 10px 4px 4px;background:var(--latte);transition:height .7s}
.fb.peak i{background:var(--burgundy)}
.fb b{font-size:13px;color:var(--ink)}
.fb em{font-style:normal;color:var(--ink2);font-size:12px}

/* Mapbox */
.mapbox{
  background:linear-gradient(var(--soft) 1px,transparent 1px) 0 0/36px 36px,linear-gradient(90deg,var(--soft) 1px,transparent 1px) 0 0/36px 36px,var(--card);
  border:1px solid var(--latte);
  border-radius:20px;
  overflow:hidden;
}
.mapbox svg{display:block;width:100%;height:auto}
.dash-line{stroke-dasharray:9 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-34}}

/* ==================== Tables & Lists ==================== */
.tbl{width:100%;border-collapse:collapse}
.tbl th{
  text-align:left;
  font-size:13px;
  color:var(--burgundy);
  font-weight:700;
  padding:14px 12px;
  border-bottom:1px solid var(--latte);
  text-transform:uppercase;
  letter-spacing:.04em;
  background:var(--bg-subtle);
}
.tbl td{padding:14px 12px;border-bottom:1px solid var(--soft);vertical-align:middle;font-size:14.5px;color:var(--ink)}
.tbl tr:hover td{background:color-mix(in srgb,var(--soft) 50%,transparent)}
.tbl tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ==================== Modal & Toasts ==================== */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(42,33,24,.45);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:200;
  display:grid;
  place-items:center;
  padding:20px;
  animation:fade .2s;
  overflow:auto;
}
@keyframes fade{from{opacity:0}}
.modal{
  background:var(--card);
  border:1px solid var(--latte);
  border-radius:26px;
  width:min(640px,100%);
  max-height:calc(100vh - 40px);
  overflow:auto;
  box-shadow:var(--shadow-lg);
  animation:pop .22s cubic-bezier(.16,1,.3,1);
  position:relative;
}
.modal .mhead{height:220px;position:relative;background:var(--bg-subtle)}
.modal .mhead img{width:100%;height:100%;object-fit:cover;display:block}
.modal .mhead .art{height:100%}
.modal .mbody{padding:26px 28px 30px}
.modal .x{
  position:absolute;
  right:16px;
  top:16px;
  width:36px;
  height:36px;
  border-radius:50%;
  border:1px solid var(--latte);
  background:var(--card);
  color:var(--ink);
  z-index:3;
  display:grid;
  place-items:center;
  box-shadow:var(--shadow-sm);
  transition:transform .15s;
}
.modal .x:hover{transform:scale(1.08);border-color:var(--latte-dark)}
.tp{background:var(--bg-subtle);border:1px solid var(--latte);border-radius:16px;padding:16px;margin:16px 0}
.tp .row{display:flex;justify-content:space-between;padding:4px 0}
.sumbox{background:var(--bg-subtle);border-radius:16px;padding:16px;margin:16px 0;border:1px solid var(--latte)}
.sumbox .row{display:flex;justify-content:space-between;padding:3px 0}
.sumbox .row.t{font-weight:700;font-size:18px;border-top:1px solid var(--latte);margin-top:8px;padding-top:10px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{
  width:42px;
  height:42px;
  border-radius:12px;
  border:1px solid var(--latte);
  background:var(--card-elevated);
  color:var(--ink);
  font-size:20px;
  display:grid;
  place-items:center;
}
.qty button:hover{background:var(--soft)}
.qty input{text-align:center;width:110px}
#toasts{
  position:fixed;
  left:0;
  right:0;
  bottom:calc(24px + env(safe-area-inset-bottom,0px));
  display:grid;
  justify-items:center;
  gap:10px;
  z-index:300;
  pointer-events:none;
}
.toast{
  background:var(--card-elevated);
  color:var(--ink);
  border:2px solid var(--latte);
  padding:12px 22px;
  border-radius:14px;
  box-shadow:var(--shadow-lg);
  animation:rise .25s cubic-bezier(.16,1,.3,1) both;
  font-weight:600;
  font-size:14.5px;
  max-width:92vw;
  display:flex;
  gap:10px;
  align-items:center;
}
.toast.err{background:var(--card-elevated);color:var(--terra);border:2px solid var(--terra)}
.stars button{background:none;border:0;font-size:32px;color:var(--latte);padding:2px;cursor:pointer}
.stars button.on{color:#C8922A}
.imgprev{height:160px;border-radius:16px;overflow:hidden;border:1px solid var(--latte);background:var(--bg-subtle)}
.imgprev img{width:100%;height:100%;object-fit:cover}
.imgprev .art{height:100%}
.small{font-size:13.5px;color:var(--ink2)}
.hr{height:1px;background:var(--latte);margin:20px 0}
.spinner{
  width:18px;
  height:18px;
  border:2.5px solid transparent;
  border-top-color:currentColor;
  border-radius:50%;
  animation:spin .6s linear infinite;
  display:inline-block;
  vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* Skeleton Pulse */
.skeleton{
  background:linear-gradient(90deg,rgba(183,168,154,0.18) 25%,rgba(232,220,198,0.55) 50%,rgba(183,168,154,0.18) 75%);
  background-size:200% 100%;
  animation:skeleton-shimmer 1.8s infinite;
  border-radius:12px;
}
@keyframes skeleton-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ==================== Award-Winning UI Enhancements ==================== */
.mandi-ticker{
  display:flex;

}

.mandi-ticker-label{

@keyframes pulseNode{

/* ============ Image Compression ============ */
async function compressImageToBlob(file, maxDim = 1280, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Failed to read image file.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Failed to load image preview.'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) {
            h = Math.round(h * (maxDim / w));
            w = maxDim;
          } else {
            w = Math.round(w * (maxDim / h));
            h = maxDim;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => {
          if (!blob) return reject(new Error('Canvas compression failed.'));
          resolve(blob);
        }, 'image/webp', quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function detectAuthGpsLocation(role) {
  if (!navigator.geolocation) {
    toast('Geolocation is not supported by your browser', 'err');
    return;
  }
  const btn = $('#a_gps_btn');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner" style="width:12px;height:12px;border-width:2px;display:inline-block"></span> Locating...`;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const closest = findClosestTown(lat, lng);
      S.authDetectedLoc = { lat, lng, nearestTown: closest.n, isGps: true };
      const sel = $('#a_loc');
      if (sel) sel.value = closest.n;
      updateAuthLocBadge();
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `${ic('map-pin', 13)} GPS Set`;
      }
      toast(`GPS location detected: ${closest.n} (${lat.toFixed(4)}, ${lng.toFixed(4)})`, 'ok');
    },
    err => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `${ic('map-pin', 13)} Use GPS`;
      }
      toast('Could not detect location: ' + (err.message || 'Permission denied'), 'err');
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

function updateAuthLocBadge() {
  const badge = $('#a_loc_badge');
  if (!badge) return;
  if (S.authDetectedLoc) {
    badge.innerHTML = `<span style="color:var(--burgundy);font-weight:600">📍 GPS Verified: ${S.authDetectedLoc.lat.toFixed(4)}, ${S.authDetectedLoc.lng.toFixed(4)}</span>`;
  } else {
    badge.innerHTML = `<span style="color:var(--ink2)">Selected from regional hub list.</span>`;
  }
}

function farmerReqMatches(u) {
  const mine = MY_LISTINGS.filter(l => l.status === 'active' && l.qty > 0);
  const out = [];
  OPEN_REQS.forEach(r => {
    let best = null;
    mine.forEach(l => {
      const m = matchScore(r, l, u);
      if (m && (!best || m.total > best.total)) best = m;
    });
    if (best) out.push({ r, m: best });
  });
  return out.sort((a, b) => b.m.total - a.m.total);
}

function farmerApp(u, tab) {
  const mine = MY_LISTINGS;
  const orders = MY_ORDERS;
  const pend = orders.filter(o => o.status === 'placed').length;
  const fm = farmerReqMatches(u);
  const badges = {
    orders: pend,
    buyers: fm.filter(x => !MY_OFFERS.some(o => o.reqId === x.r.id && o.farmerId === u.id)).length
  };

  let c = '';
  if (tab === 'add') c = fAdd(u);
  else if (tab === 'listings') c = fListings(u, mine);
  else if (tab === 'orders') c = fOrders(u, orders);
  else if (tab === 'buyers') c = fBuyers(u, fm);
  else if (tab === 'prices') c = marketPricesView(u, 'farmer');
  else if (tab === 'insights') c = fInsights(u, mine);
  else if (tab === 'route') c = fRoute(u, orders);
  else c = fOverview(u, mine, orders, fm);

  const locDisplay = `📍 ${esc(u.loc.label)}${u.loc && u.loc.isGps ? ' (GPS Verified)' : ''}`;
  const editLocBtn = `<button type="button" class="btn btn-xs btn-subtle" onclick="openEditLocationModal()" style="display:inline-flex;align-items:center;gap:3px;margin-left:6px;vertical-align:middle;padding:2px 8px;font-size:11px;border-radius:999px;background:rgba(255,255,255,0.22);color:inherit;border:1px solid currentColor;cursor:pointer">${ic('map-pin', 11)} Change</button>`;
  return shell(u, 'farmer', FT, tab, badges, `${greet()}, ${esc(u.name.split(' ')[0])}`, `${esc(u.org)} · ${locDisplay}${editLocBtn} · Farmer Account`, c);
}

function updHint() {
  const c = $('#p_crop') ? $('#p_crop').value : S.fAdd.crop;
  const p = parseFloat($('#p_price') ? $('#p_price').value : S.fAdd.price) || 0;
  const m = marketRef(c);
  let demandStatus = 'Balanced market rate';
  let demandClass = 'b-neutral';

  if (p > 0) {
    const diff = (p - m.ref) / m.ref;
    if (diff < -0.15) {
      demandStatus = '🔥 High Demand Zone · Fast Buyer Clearance';
      demandClass = 'b-good';
    } else if (diff <= 0.10) {
      demandStatus = '⚖️ Optimal Mandi Equilibrium · Highly Competitive';
      demandClass = 'b-good';
    } else {
      demandStatus = '✨ Premium Grade Pricing · Verified Quality';
      demandClass = 'b-warn';
    }
  }

  let h = `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px">
    <span>${ic('spark', 15)} <b>Smart Price Advisor</b></span>
    <span class="badge ${demandClass}">${demandStatus}</span>
  </div>
  <div>Market reference for ${c}: <b>${inr(m.ref)}/kg</b> (${m.src}).`;
  if (p > 0) {
    const b = priceBadge(p, m.ref);
    h += ` Your price is <b>${Math.abs(Math.round(b.d * 100))}% ${b.d < 0 ? 'below' : 'above'}</b> the reference: <span class="badge ${b.c}">${b.t}</span></div>`;
  } else {
    h += `</div>`;
  }
  const el = $('#p_hint');
  if (el) el.innerHTML = h;
}

function updPreviewCard() {

async function pickImg(inp) {
  const f = inp.files && inp.files[0];
  if (!f) return;
  if (!/^image\//.test(f.type)) return toast('Choose an image file (JPG, PNG, or WebP).', 'err');
  if (f.size > 5 * 1024 * 1024) return toast('Image must be under 5 MB.', 'err');

  try {
    const compressed = await compressImageToBlob(f, 1280, 0.82);
    S.imgFile = compressed;
    S.imgPreviewUrl = URL.createObjectURL(compressed);
    toast('Photo selected and compressed');
    updateDzUI();
    updPreviewCard();
  } catch(e) {
    toast(e.message || 'Could not process photo.', 'err');
  }
}

async function publish() {
  if (S.isSubmitting) return;

  const cropEl = $('#p_crop');
  const qtyEl = $('#p_qty');
  const priceEl = $('#p_price');
  const gradeEl = $('#p_grade');
  const dateEl = $('#p_date');
  const locEl = $('#p_loc');
  const noteEl = $('#p_note');
  const unitEl = $('#p_unit');

  const crop = cropEl ? cropEl.value : S.fAdd.crop;
  let qty = parseFloat(qtyEl ? qtyEl.value : S.fAdd.qty);
  const price = parseFloat(priceEl ? priceEl.value : S.fAdd.price);
  const unit = unitEl ? unitEl.value : S.fAdd.unit;

  if (unit === 'tons') qty *= 1000;
  if (!(qty > 0)) return toast('Enter the quantity you have available.', 'err');
  if (!(price > 0)) return toast('Enter your expected price per kg.', 'err');

  S.isSubmitting = true;
  const btn = $('#pubBtn');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Publishing to database...`;
  }

  try {
    let imgUrl = null;
    let photoFailed = false;
    if (S.imgFile) {
      try {
        imgUrl = await window.DFApi.uploadListingPhoto(S.imgFile);
      } catch(photoErr) {
        console.warn('Photo upload failed:', photoErr);
        photoFailed = true;
      }
    }

    const locVal = locEl ? locEl.value : (S.fAdd.loc || '');
    let loc;
    if (S.fAdd.detectedLoc && S.fAdd.detectedLoc.nearestTown === locVal) {
      loc = {
        label: locVal,
        lat: S.fAdd.detectedLoc.lat,
        lng: S.fAdd.detectedLoc.lng,
        isGps: true
      };
    } else if (CURRENT_USER && CURRENT_USER.loc && CURRENT_USER.loc.isGps && CURRENT_USER.loc.label === locVal) {
      loc = { ...CURRENT_USER.loc };
    } else {
      loc = town(locVal);
    }
    const grade = gradeEl ? gradeEl.value : (S.fAdd.grade || 'A');
    const harvest = dateEl ? dateEl.value : (S.fAdd.date || null);
    const note = (noteEl ? noteEl.value : S.fAdd.note).trim();

    const newListingId = await window.DFApi.createListing({
      crop,
      qty,
      price,
      grade,
      harvest,
      loc,
      note,
      imageUrl: imgUrl
    });

    if (!newListingId) {
      throw new Error('Failed to create listing in database.');
    }

    S.fAdd = {
      crop: 'Tomato',
      grade: 'A',
      qty: '',
      unit: 'kg',
      price: '',
      date: new Date().toISOString().slice(0, 10),
      loc: CURRENT_USER ? CURRENT_USER.loc.label : '',
      detectedLoc: null,
      note: ''
    };
    S.imgFile = null;
    S.imgPreviewUrl = null;

    if (photoFailed) {
      toast('Product was listed, but the photo could not be uploaded.', 'err');
    } else {
      toast('Produce published successfully to shared database!');
    }

    // Refresh farmer listings and visible marketplace data
    MY_LISTINGS = await window.DFApi.myListings();
    ACTIVE_LISTINGS = await window.DFApi.listListings((LISTINGS_PAGE + 1) * PAGE_SIZE, 0);

    go('#/farmer/listings');
  } catch(e) {
    console.error('Publish produce error:', e);
    toast(e.message || 'Failed to publish produce.', 'err');
  } finally {
    S.isSubmitting = false;
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = `${ic('leaf', 18)} Publish produce to marketplace`;
    }
  }
}

function detectListingGpsLocation() {
  if (!navigator.geolocation) {
    toast('Geolocation is not supported by your browser', 'err');
    return;
  }
  const btn = $('#p_gps_btn');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner" style="width:12px;height:12px;border-width:2px;display:inline-block"></span> Locating...`;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const closest = findClosestTown(lat, lng);
      S.fAdd.detectedLoc = { lat, lng, nearestTown: closest.n, isGps: true };
      S.fAdd.loc = closest.n;
      const sel = $('#p_loc');
      if (sel) sel.value = closest.n;
      updateListingLocBadge();
      updPreviewCard();
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `${ic('map-pin', 13)} GPS Set`;
      }
      toast(`Harvest location set: ${closest.n} (${lat.toFixed(4)}, ${lng.toFixed(4)})`, 'ok');
    },
    err => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `${ic('map-pin', 13)} Field GPS`;
      }
      toast('Could not detect field GPS: ' + (err.message || 'Permission denied'), 'err');
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

function updateListingLocBadge() {
  const badge = $('#p_loc_badge');
  if (!badge) return;
  if (S.fAdd.detectedLoc) {

function toggleFarmerOrderAccordion(id, e) {
  if (e) e.stopPropagation();
  if (!S.fExpandedOrders) S.fExpandedOrders = new Set();
  const isOpen = S.fExpandedOrders.has(id);
  if (isOpen) {
    S.fExpandedOrders.delete(id);
  } else {
    S.fExpandedOrders.add(id);
  }
  const nextOpen = !isOpen;
  const drawer = document.getElementById('order-drawer-' + id);
  const btn = document.getElementById('order-btn-' + id);
  if (drawer) drawer.classList.toggle('open', nextOpen);
  if (btn) {
    const defaultLabel = btn.getAttribute('data-label') || 'View Details ↓';
    btn.innerHTML = nextOpen ? 'Close Details ↑' : defaultLabel;
    btn.classList.toggle('active', nextOpen);
  }
}

async function advance(id) {

async function acceptAndSupplyRequirement(reqId, listingId, qty, price) {
  try {
    toast('Accepting requirement and confirming order...');
    const offerId = await window.DFApi.createOffer({
      reqId: reqId,
      listingId: listingId,
      qty: Number(qty),
      price: Number(price),
      delivery: true
    });
    try {
      await window.DFApi.acceptOffer(offerId);
    } catch (e) {
      console.warn('Direct acceptance note:', e);
    }
    toast('Order confirmed! Deal successfully closed.');
    await reloadAppData();
    go('#/farmer/orders');

    toast(err.message || 'Could not supply requirement.', 'err');

function fRoute(u, orders) {
  const act = orders.filter(o => ['confirmed', 'preparing', 'out'].includes(o.status));
  if (!act.length) {
    return `<div class="empty">

  const stops = act.map(o => ({ o, loc: o.dest, label: o.dest.label })), origin = u.loc;
  const { route, total } = planRoute(origin, stops), naive = naiveDist(origin, stops), saved = naive > 0 ? Math.max(0, Math.round((naive - total) / naive * 100)) : 0;
  const pts = [origin, ...route.map(r => r.loc)];
  const W = 760, H = 420, P = 60, lats = pts.map(p => p.lat), lngs = pts.map(p => p.lng);
  const minLa = Math.min(...lats), maxLa = Math.max(...lats), minLo = Math.min(...lngs), maxLo = Math.max(...lngs), spLa = Math.max(maxLa - minLa, .15), spLo = Math.max(maxLo - minLo, .15);
  const X = p => P + (p.lng - minLo) / spLo * (W - 2 * P), Y = p => H - P - (p.lat - minLa) / spLa * (H - 2 * P);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p).toFixed(1) + ' ' + Y(p).toFixed(1)).join(' ');
  const hours = total / 40 + route.length * .25, fuel = total * 12;

    <div class="kpi"><span>${ic('pin', 16)} Optimised distance</span><b>${total.toFixed(0)} km</b></div>

  <div class="grid2 grid-route">
    <div class="mapbox">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Optimised delivery route map">
        <path class="dash-line" d="${line}" fill="none" stroke="#722F37" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <g>
          <circle cx="${X(origin)}" cy="${Y(origin)}" r="18" fill="#722F37" stroke="#B7A89A" stroke-width="2"/>
          <text x="${X(origin)}" y="${Y(origin)+5}" text-anchor="middle" fill="#FFFDFC" font-size="14" font-weight="700">F</text>

        </g>

          <g>
            <circle cx="${X(r.loc)}" cy="${Y(r.loc)}" r="16" fill="#E8DCC6" stroke="#722F37" stroke-width="2"/>
            <text x="${X(r.loc)}" y="${Y(r.loc)+5}" text-anchor="middle" fill="#722F37" font-size="14" font-weight="700">${i+1}</text>

      ${route.map((r, i) => {

async function postReq() {
  if (S.isSubmitting) return;
  if (!CURRENT_USER) {
    go('#/buyer/login');
    return toast('Please log in to post a requirement.', 'err');
  }
  const token = (typeof localStorage !== 'undefined' && localStorage.getItem('df_buyer_token')) || window.DFApi.getToken();
  if (!token) {
    return handleSessionExpired();
  }

  const cropEl = $('#r_crop');
  const qtyEl = $('#r_qty');
  const priceEl = $('#r_price');
  const gradeEl = $('#r_grade');
  const byEl = $('#r_by');
  const locEl = $('#r_loc');
  const distEl = $('#r_dist');

  const crop = cropEl ? cropEl.value : S.bPost.crop;
  const qty = parseFloat(qtyEl ? qtyEl.value : S.bPost.qty);
  const mp = parseFloat(priceEl ? priceEl.value : S.bPost.price);
  const grade = gradeEl ? gradeEl.value : (S.bPost.grade || 'A');
  const byDate = byEl ? byEl.value : S.bPost.by;
  const locVal = locEl ? locEl.value : (S.bPost.loc || '');
  const md = parseFloat(distEl ? distEl.value : S.bPost.dist);

  if (!(qty > 0)) return toast('Enter the quantity you need.', 'err');
  if (!(mp > 0)) return toast('Enter the highest price you will pay.', 'err');
  if (!(md > 0)) return toast('Enter a search distance in km.', 'err');

  S.isSubmitting = true;
  const btn = $('#postReqBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Posting...`; }

  try {
    const loc = town(locVal);
    await window.DFApi.createRequirement({
      token,
      crop,
      qty,
      maxPrice: mp,
      grade,
      byDate,
      loc,
      maxDist: md
    });

    S.bPost = {
      crop: 'Tomato',
      grade: 'A',
      qty: '',
      price: '',
      by: new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10),
      loc: CURRENT_USER ? CURRENT_USER.loc.label : '',
      dist: 50
    };

    toast('Requirement posted to shared database. Farmers will be matched.');
    await reloadAppData();
    go('#/buyer/reqs');
  } catch(e) {
    toast(e.message || 'Failed to post requirement.', 'err');
  } finally {
    S.isSubmitting = false;
    if (btn) { btn.disabled = false; btn.innerHTML = `${ic('spark', 18)} Post procurement requirement`; }
  }
}

function getFarmerLocation(order) {
  if (!order) return { lat: 16.5449, lng: 81.5212, label: 'Farmer Farm (Bhimavaram)' };

  // 1. From tracking data or order farmerLoc
  if (order.farmerLoc && typeof order.farmerLoc.lat === 'number' && typeof order.farmerLoc.lng === 'number') {
    return {
      lat: Number(order.farmerLoc.lat),
      lng: Number(order.farmerLoc.lng),
      label: order.farmerLoc.label || (order.farmerOrg ? `${order.farmerOrg} Farm` : 'Farmer Farm')
    };
  }

  // 2. Check local order caches for this order's farm origin
  try {
    const saved = localStorage.getItem('df_order_farmer_loc_' + order.id) || localStorage.getItem('df_farmer_loc_' + order.id);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && typeof parsed.lat === 'number' && typeof parsed.lng === 'number') {
        return {
          lat: Number(parsed.lat),
          lng: Number(parsed.lng),
          label: parsed.label || (order.farmerOrg ? `${order.farmerOrg} Farm` : 'Farmer Farm')
        };
      }
    }
  } catch(e) {}

  // 3. If currently logged in as the farmer for this order
  if (CURRENT_USER && CURRENT_USER.role === 'farmer' && CURRENT_USER.loc && typeof CURRENT_USER.loc.lat === 'number') {
    if (!order.farmerId || order.farmerId === CURRENT_USER.id) {
      return {
        lat: Number(CURRENT_USER.loc.lat),
        lng: Number(CURRENT_USER.loc.lng),
        label: CURRENT_USER.loc.label || (order.farmerOrg ? `${order.farmerOrg} Farm` : 'Farmer Farm')
      };
    }
  }

  // 4. From associated active or my listings
  const allListings = (typeof ACTIVE_LISTINGS !== 'undefined' && Array.isArray(ACTIVE_LISTINGS) ? ACTIVE_LISTINGS : [])
    .concat(typeof MY_LISTINGS !== 'undefined' && Array.isArray(MY_LISTINGS) ? MY_LISTINGS : []);
  
  let listing = allListings.find(l => l && l.id === order.listingId);
  if (!listing && order.farmerId) {
    listing = allListings.find(l => l && l.farmerId === order.farmerId && l.loc && typeof l.loc.lat === 'number');
  }
  if (listing && listing.loc && typeof listing.loc.lat === 'number') {
    return {
      lat: Number(listing.loc.lat),
      lng: Number(listing.loc.lng),
      label: listing.loc.label ? `${listing.loc.label} Farm (${order.farmerOrg || order.farmerName || 'Farmer'})` : (order.farmerOrg || 'Farmer Farm')
    };
  }

  // 5. Match farmerOrg or farmerName against TOWNS
  const nameText = `${order.farmerOrg || ''} ${order.farmerName || ''} ${order.farmerLocLabel || ''}`.toLowerCase();
  const matchedTown = TOWNS.find(t => nameText.includes(t.n.toLowerCase()));
  if (matchedTown) {
    return {
      lat: matchedTown.lat,
      lng: matchedTown.lng,
      label: `${matchedTown.n} Farm (${order.farmerOrg || order.farmerName || 'Farmer'})`
    };
  }

  // 6. Default fallback coordinate (Bhimavaram)
  return {
    lat: 16.5449,
    lng: 81.5212,
    label: order.farmerOrg ? `${order.farmerOrg} Farm (Bhimavaram)` : 'Farmer Farm (Bhimavaram)'
  };
}

async function fetchOsrmRoute(origin, destination) {
  const oLat = Number(origin.lat), oLng = Number(origin.lng);
  const dLat = Number(destination.lat), dLng = Number(destination.lng);
  const cacheKey = `${oLat.toFixed(4)},${oLng.toFixed(4)}_${dLat.toFixed(4)},${dLng.toFixed(4)}`;

  if (_osrmRouteCache[cacheKey]) {
    return _osrmRouteCache[cacheKey];
  }

  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${oLng},${oLat};${dLng},${dLat}?overview=full&geometries=geojson`;
    const ctrl = new AbortController();
    const timeoutId = setTimeout(() => ctrl.abort(), 3500);
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timeoutId);

    if (res.ok) {
      const data = await res.json();
      if (data && data.routes && data.routes.length > 0) {
        const route = data.routes[0];
        const latLngs = (route.geometry && route.geometry.coordinates)
          ? route.geometry.coordinates.map(pt => [pt[1], pt[0]])
          : [[oLat, oLng], [dLat, dLng]];
        const distKm = Number((route.distance / 1000).toFixed(1));
        const durMins = Math.max(1, Math.round(route.duration / 60));
        const result = {
          success: true,
          coordinates: latLngs,
          distanceKm: distKm,
          durationMins: durMins,
          isRoadNetwork: true
        };
        _osrmRouteCache[cacheKey] = result;
        return result;
      }
    }
  } catch(e) {
    console.warn('OSRM routing fetch unavailable, using safe fallback road calculation:', e);
  }

  // Safe fallback calculation: haversine with road multiplier
  const estKm = Number(km(origin, destination).toFixed(1));
  const estMins = Math.max(10, Math.round(estKm / 35 * 60));
  const fallbackResult = {
    success: false,
    coordinates: [[oLat, oLng], [dLat, dLng]],
    distanceKm: estKm,
    durationMins: estMins,
    isRoadNetwork: false
  };
  _osrmRouteCache[cacheKey] = fallbackResult;
  return fallbackResult;
}

function projectPointOnSegment(p, a, b) {
  const dx = b[1] - a[1];
  const dy = b[0] - a[0];
  const lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return { lat: a[0], lng: a[1], dist: km(p, { lat: a[0], lng: a[1] }) };

  const t = Math.max(0, Math.min(1, ((p.lng - a[1]) * dx + (p.lat - a[0]) * dy) / lenSq));
  const snapLat = a[0] + t * dy;
  const snapLng = a[1] + t * dx;
  const snapPt = { lat: snapLat, lng: snapLng };
  return {
    lat: snapLat,
    lng: snapLng,
    dist: km(p, snapPt)
  };
}

function snapToRoadPolyline(curLoc, routeCoordinates) {
  if (!curLoc || typeof curLoc.lat !== 'number' || !routeCoordinates || routeCoordinates.length < 2) return curLoc;
  let best = null;
  let bestDist = Infinity;
  let bestSegment = 0;

  for (let i = 0; i < routeCoordinates.length - 1; i++) {
    const proj = projectPointOnSegment(curLoc, routeCoordinates[i], routeCoordinates[i + 1]);
    if (proj.dist < bestDist) {
      bestDist = proj.dist;
      best = proj;
      bestSegment = i;
    }
  }

  // If vehicle is within 1.2 km of the highway/road, snap smoothly along the road geometry!
  if (best && bestDist <= 1.2) {
    return {
      lat: best.lat,
      lng: best.lng,
      segmentIdx: bestSegment,
      speed: curLoc.speed,
      label: curLoc.label,
      isSnapped: true
    };
  }
  return curLoc;
}

function calculateRoadRemainingKm(snappedLoc, routeCoordinates) {
  if (!routeCoordinates || routeCoordinates.length < 2) return null;
  const segIdx = (snappedLoc && typeof snappedLoc.segmentIdx === 'number') ? snappedLoc.segmentIdx : 0;
  
  if (segIdx >= routeCoordinates.length - 1) return 0;

  let rem = km(snappedLoc, { lat: routeCoordinates[segIdx + 1][0], lng: routeCoordinates[segIdx + 1][1] });

  for (let i = segIdx + 1; i < routeCoordinates.length - 1; i++) {
    rem += km(
      { lat: routeCoordinates[i][0], lng: routeCoordinates[i][1] },
      { lat: routeCoordinates[i + 1][0], lng: routeCoordinates[i + 1][1] }
    );
  }
  return Number(Math.max(0, rem).toFixed(1));
}

let _lastValidVehicleSpeed = 40;

function calculateDynamicEta(remainingKm, curLoc, defaultDurationMins) {
  if (remainingKm <= 0.05) return 'Arrived';
  
  const rawSpeed = curLoc && typeof curLoc.speed === 'number' ? curLoc.speed : null;
  if (rawSpeed !== null && rawSpeed > 5) {
    _lastValidVehicleSpeed = rawSpeed;
    const mins = Math.max(1, Math.round((remainingKm / rawSpeed) * 60));
    return `~${mins} mins (${rawSpeed} km/h)`;
  }
  
  // When stopped at a signal or traffic: Maintain last valid speed estimate with traffic factor
  const trafficFactor = 0.85;
  const effectiveSpeed = Math.max(15, Math.round((_lastValidVehicleSpeed || 40) * trafficFactor));
  const mins = Math.max(1, Math.round((remainingKm / effectiveSpeed) * 60));
  
  if (rawSpeed !== null && rawSpeed <= 5) {
    return `~${mins} mins (traffic/signal)`;
  }
  return `~${mins} mins`;
}

function updateTrackingMetricsUI(order, tracking, farmLoc, buyerLoc, curLoc, totalDist, maybeRoadRemainingKm, maybeDurationMins) {
  const totalKm = Number(totalDist ? Number(totalDist).toFixed(1) : km(farmLoc, buyerLoc).toFixed(1));
  let remainingDist = totalKm;
  let coveredDist = 0;
  const durMins = maybeDurationMins || Math.max(10, Math.round(totalKm / 35 * 60));
  let etaText = `~${durMins} mins`;

  if (order.status === 'delivered') {
    remainingDist = 0;
    coveredDist = totalKm;
    etaText = 'Delivered';
  } else if (order.status === 'out') {
    if (maybeRoadRemainingKm != null) {
      remainingDist = Math.min(totalKm, maybeRoadRemainingKm);
      coveredDist = Number(Math.max(0, totalKm - remainingDist).toFixed(1));
      etaText = calculateDynamicEta(remainingDist, curLoc, durMins);
    } else if (curLoc && typeof curLoc.lat === 'number') {
      const directToBuyer = km(curLoc, buyerLoc);
      remainingDist = Number(Math.min(totalKm, Math.max(0, directToBuyer)).toFixed(1));
      coveredDist = Number(Math.max(0, totalKm - remainingDist).toFixed(1));
      etaText = calculateDynamicEta(remainingDist, curLoc, durMins);
    }
  }

  const totalDistEl = document.getElementById('trackTotalDistText');
  const coveredEl = document.getElementById('trackDistCoveredText');
  const remainingEl = document.getElementById('trackDistRemainingText');
  const etaEl = document.getElementById('trackEtaText');
  const speedEl = document.getElementById('trackSpeedText');
  const coveredSubEl = document.getElementById('trackCoveredSub');
  const locEl = document.getElementById('trackLocText');
  const statusEl = document.getElementById('trackStatusText');
  const liveBadgeEl = document.getElementById('trackLiveBadge');

  if (totalDistEl) totalDistEl.textContent = `${totalKm} km`;
  if (coveredEl) coveredEl.textContent = `${coveredDist} km`;
  if (remainingEl) remainingEl.textContent = `${remainingDist} km`;
  if (etaEl) etaEl.textContent = etaText;
  if (coveredSubEl) {
    const pct = Math.min(100, Math.max(0, Math.round((coveredDist / (totalKm || 1)) * 100)));
    coveredSubEl.textContent = order.status === 'delivered' ? '100% Completed' : `${pct}% of journey completed`;
  }
  if (speedEl) {
    speedEl.textContent = (tracking && tracking.isLive && curLoc && curLoc.speed)
      ? `${curLoc.speed} km/h live speed`
      : 'Road network transit';
  }
  if (locEl) locEl.textContent = (curLoc && curLoc.label) || (order.status === 'out' ? 'In transit' : farmLoc.label);
  if (statusEl && order.status) statusEl.textContent = SL[order.status] || order.status;
  if (liveBadgeEl) {
    liveBadgeEl.innerHTML = (tracking && tracking.isLive)
      ? `<span class="live-pulse">Live Driver GPS Active</span>`
      : `<span class="badge b-neutral">${order.status === 'out' ? 'In Transit' : 'Awaiting Dispatch'}</span>`;
  }
}

function initOrderMap(order, tracking) {
  const mapEl = document.getElementById('order-map');
  const fallbackEl = document.getElementById('map-fallback');
  if (!mapEl) return;

  if (typeof L === 'undefined') {
    if (fallbackEl) fallbackEl.style.display = 'block';
    mapEl.style.display = 'none';
    return;
  }

  try {
    const farmLoc = (tracking && tracking.farmerLoc) ? tracking.farmerLoc : getFarmerLocation(order);
    const buyerLoc = {
      lat: Number(order.dest && order.dest.lat) || 16.5062,
      lng: Number(order.dest && order.dest.lng) || 80.6480,
      label: (order.dest && order.dest.label) || 'Buyer Destination'
    };

    let curLoc;
    if (tracking && tracking.currentLoc && typeof tracking.currentLoc.lat === 'number') {
      curLoc = {
        lat: Number(tracking.currentLoc.lat),
        lng: Number(tracking.currentLoc.lng),
        label: tracking.currentLoc.label || 'Driver Vehicle (GPS Active)',
        speed: tracking.currentLoc.speed
      };
    } else if (order.status === 'delivered') {
      curLoc = { lat: buyerLoc.lat, lng: buyerLoc.lng, label: 'Delivered at ' + buyerLoc.label };
    } else {
      curLoc = { lat: farmLoc.lat, lng: farmLoc.lng, label: farmLoc.label };
    }

    // Snap to road polyline if road coordinates are already available
    const snapped = (_currentRouteCoordinates && _currentRouteCoordinates.length)
      ? snapToRoadPolyline(curLoc, _currentRouteCoordinates)
      : curLoc;

    _currentVehiclePos = snapped;

    // 1. Check if the Leaflet map is ALREADY correctly mounted on this exact DOM element in the document
    const existingContainer = _currentLeafletMap ? _currentLeafletMap.getContainer() : null;
    const isMapMounted = existingContainer && existingContainer === mapEl && document.body.contains(mapEl);

    if (isMapMounted && _currentLeafletMarkers.orderId === order.id && _currentLeafletMarkers.truck) {
      // ISOLATED MARKER UPDATE: Never recreate DOM or touch user's zoom/pan
      _currentLeafletMarkers.truck.setLatLng([snapped.lat, snapped.lng]);
      const popupText = snapped.speed
        ? `<b>Delivery Vehicle: In Transit (${snapped.speed} km/h)</b>`
        : `<b>Delivery Vehicle: ${esc(snapped.label || 'In Transit')}</b>`;
      _currentLeafletMarkers.truck.setPopupContent(popupText);

      const remainingKm = (_currentRouteCoordinates && _currentRouteCoordinates.length)
        ? calculateRoadRemainingKm(snapped, _currentRouteCoordinates)
        : null;

      updateTrackingMetricsUI(order, tracking, farmLoc, buyerLoc, snapped, _lastCalculatedRouteDist || km(farmLoc, buyerLoc), remainingKm);
      return;
    }

    // 2. Otherwise initialize fresh Leaflet map on this DOM element (first load of track screen)
    if (_currentLeafletMap) {
      try { _currentLeafletMap.remove(); } catch(e) {}
      _currentLeafletMap = null;
    }
    if (mapEl._leaflet_id) {
      delete mapEl._leaflet_id;
    }

    if (fallbackEl) fallbackEl.style.display = 'none';
    mapEl.style.display = 'block';

    const map = L.map(mapEl, {
      zoomControl: true,
      fadeAnimation: true,
      zoomAnimation: true
    }).setView([snapped.lat, snapped.lng], 11);

    _currentLeafletMap = map;
    _mapUserInteracted = false;

    // Track user drag/zoom to prevent any automated zoom resets
    map.on('zoomstart dragstart touchstart movestart', () => {
      _mapUserInteracted = true;
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const farmIcon = L.divIcon({
      html: '<div style="background:#35632F;color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,0.3);border:2px solid #fff">🌱</div>',

      iconSize: [32, 32],

    const truckIcon = L.divIcon({
      html: '<div style="background:#0F52BA;color:#fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 3px 8px rgba(0,0,0,0.4);border:2px solid #fff;transition:transform 0.3s ease">🚚</div>',

    const truckMarker = L.marker([snapped.lat, snapped.lng], { icon: truckIcon })
      .addTo(map)
      .bindPopup(truckPopup);

    let initialCoords = [[farmLoc.lat, farmLoc.lng], [buyerLoc.lat, buyerLoc.lng]];
    if (snapped && (snapped.lat !== farmLoc.lat || snapped.lng !== farmLoc.lng)) {
      initialCoords = [[farmLoc.lat, farmLoc.lng], [snapped.lat, snapped.lng], [buyerLoc.lat, buyerLoc.lng]];
    }

    const polyline = L.polyline(initialCoords, {
      color: '#0F52BA',
      weight: 5,
      opacity: 0.85,
      lineJoin: 'round'
    }).addTo(map);

    _currentLeafletMarkers = {
      orderId: order.id,
      farm: farmMarker,
      buyer: buyerMarker,
      truck: truckMarker,
      polyline: polyline,
      hasFittedBounds: false
    };

    // Fit bounds ONLY ONCE on initial map creation!
    const initialBounds = L.latLngBounds(initialCoords);
    map.fitBounds(initialBounds, { padding: [40, 40] });
    _currentLeafletMarkers.hasFittedBounds = true;

    // Invalidate size after mount to prevent grey/missing tiles
    setTimeout(() => {
      if (_currentLeafletMap) _currentLeafletMap.invalidateSize();
    }, 60);
    setTimeout(() => {
      if (_currentLeafletMap) _currentLeafletMap.invalidateSize();
    }, 250);

    const estTotalKm = Number(km(farmLoc, buyerLoc).toFixed(1));
    updateTrackingMetricsUI(order, tracking, farmLoc, buyerLoc, snapped, estTotalKm);

    // 3. Asynchronously fetch full road geometry from OSRM without blocking UI!
    fetchOsrmRoute(farmLoc, buyerLoc).then(route => {
      if (!route || !route.coordinates || !route.coordinates.length) return;
      _currentRouteCoordinates = route.coordinates;
      _lastCalculatedRouteDist = route.distanceKm;

      if (_currentLeafletMap && _currentLeafletMarkers.orderId === order.id && _currentLeafletMarkers.polyline) {
        _currentLeafletMarkers.polyline.setLatLngs(route.coordinates);
        
        // Snap vehicle to the true road geometry
        const resnapped = snapToRoadPolyline(curLoc, route.coordinates);
        _currentVehiclePos = resnapped;
        if (_currentLeafletMarkers.truck) {
          _currentLeafletMarkers.truck.setLatLng([resnapped.lat, resnapped.lng]);
        }

        const remainingKm = calculateRoadRemainingKm(resnapped, route.coordinates);
        updateTrackingMetricsUI(order, tracking, farmLoc, buyerLoc, resnapped, route.distanceKm, remainingKm, route.durationMins);
      }
    }).catch(err => {
      console.warn('Background OSRM route fetch error:', err);
    });

  } catch(e) {
    console.warn('Map initialization failed:', e);
    if (fallbackEl) fallbackEl.style.display = 'block';
    mapEl.style.display = 'none';
  }
}

function startTrackingPoll(orderId, orderStatus) {
  stopTrackingPoll();
  trackingOrderId = orderId;

  const handleInstantUpdate = (loc) => {
    if (!loc || loc.orderId !== orderId) return;
    const cached = trackingDataCache[orderId] || {};
    cached.currentLoc = {
      lat: loc.lat,
      lng: loc.lng,
      speed: loc.speed,
      label: loc.label || 'Driver Vehicle (GPS Active)',
      updatedAt: loc.updatedAt || Date.now()
    };
    cached.isLive = true;
    if (loc.farmerLoc && typeof loc.farmerLoc.lat === 'number') {
      cached.farmerLoc = loc.farmerLoc;
    }
    cached.lastUpdated = loc.updatedAt || Date.now();
    trackingDataCache[orderId] = cached;

    const ord = MY_ORDERS.find(o => o.id === orderId) || { id: orderId, status: 'out' };
    if (cached.farmerLoc) ord.farmerLoc = cached.farmerLoc;
    initOrderMap(ord, cached);
  };

  const onCustomUpdate = (e) => {
    if (e.detail) handleInstantUpdate(e.detail);
  };
  const onStorageUpdate = (e) => {
    if (e.key === 'df_live_tracking_' + orderId && e.newValue) {
      try {
        const parsed = JSON.parse(e.newValue);
        handleInstantUpdate(parsed);
      } catch(err) {}
    }
  };

  window.addEventListener('df-location-updated', onCustomUpdate);
  window.addEventListener('storage', onStorageUpdate);

  _trackingListeners = { custom: onCustomUpdate, storage: onStorageUpdate };

  const pollAction = async () => {
    if (document.visibilityState !== 'visible') return;
    const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (!CURRENT_USER || p[1] !== 'track') {
      stopTrackingPoll();
      return;
    }

    try {
      const token = window.DFApi.getToken();
      const res = await fetch(`/api/tracking/${orderId}?token=${encodeURIComponent(token)}`);
      if (res.ok) {
        const data = await res.json();
        if (data && data.success) {
          trackingDataCache[orderId] = data;

          const updEl = document.getElementById('trackUpdatedText');
          if (updEl && data.lastUpdated) updEl.textContent = ago(data.lastUpdated);

          const ord = Object.assign({}, MY_ORDERS.find(o => o.id === orderId) || {}, data);
          if (data.farmerLoc) ord.farmerLoc = data.farmerLoc;
          if (data.destLoc) ord.dest = data.destLoc;
          initOrderMap(ord, data);

          if (data.status === 'delivered') {
            stopTrackingPoll();
          }
        }
      }
    } catch(err) {
      console.warn('Tracking poll error:', err);
    }
  };

  pollAction();

  const interval = orderStatus === 'out' ? 2500 : 5000;
  trackingPollTimer = setInterval(pollAction, interval);
}

function stopTrackingPoll() {
  if (trackingPollTimer) {
    clearInterval(trackingPollTimer);
    trackingPollTimer = null;
  }
  if (_trackingListeners) {
    if (_trackingListeners.custom) window.removeEventListener('df-location-updated', _trackingListeners.custom);
    if (_trackingListeners.storage) window.removeEventListener('storage', _trackingListeners.storage);
    _trackingListeners = null;
  }
  trackingOrderId = null;
}

function startLiveLocationSharing(orderId) {
  if (!navigator.geolocation) {
    return toast('Geolocation is not supported by your browser.', 'err');
  }

  stopLiveLocationSharing();
  activeGpsOrderId = orderId;
  toast('Live GPS broadcast active. Watching delivery location...');

  const broadcastCoords = async (latitude, longitude, speed, heading) => {
    const speedKmH = (speed != null && speed > 0) ? Math.round(speed * 3.6) : null;
    const farmLoc = (CURRENT_USER && CURRENT_USER.loc && typeof CURRENT_USER.loc.lat === 'number')
      ? CURRENT_USER.loc
      : null;

    const payload = {
      orderId,
      lat: latitude,
      lng: longitude,
      speed: speedKmH,
      heading: heading || null,
      label: 'Driver Vehicle (GPS Active)',
      farmerLoc: farmLoc,
      updatedAt: Date.now()
    };

    // 1. Update localStorage so same-browser buyer tab updates in 0ms
    try {
      localStorage.setItem('df_live_tracking_' + orderId, JSON.stringify(payload));
      if (farmLoc) {
        localStorage.setItem('df_farmer_loc_' + orderId, JSON.stringify(farmLoc));
      }
    } catch(e) {}

    // 2. Dispatch custom event for same-window updates
    window.dispatchEvent(new CustomEvent('df-location-updated', { detail: payload }));

    // 3. Send to backend server API
    try {
      if (window.DFApi && window.DFApi.updateTrackingLocation) {
        await window.DFApi.updateTrackingLocation(orderId, payload);
      } else {
        const token = window.DFApi.getToken();
        await fetch('/api/tracking/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.assign({ token }, payload))
        });
      }
    } catch(e) {
      console.warn('GPS Error', e);
    }
  };

  liveGpsWatchId = navigator.geolocation.watchPosition(
    (pos) => {
      const { latitude, longitude, speed, heading } = pos.coords;
      broadcastCoords(latitude, longitude, speed, heading);
      render();
    },
    (err) => {
      console.warn('GPS Error', err);
      toast('Could not access device GPS: ' + (err.message || 'Permission denied'), 'err');
      stopLiveLocationSharing();
      render();
    },
    { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
  );

  render();
}

function stopLiveLocationSharing() {
  if (liveGpsWatchId !== null) {
    navigator.geolocation.clearWatch(liveGpsWatchId);
    liveGpsWatchId = null;
  }
  activeGpsOrderId = null;
  render();
}

/* ============ AGMARKNET Live Market Prices ============ */
async function loadMarketPrices(commodity, stateId, force) {
  if (MARKET_PRICES_LOADING && !force) return;
  MARKET_PRICES_LOADING = true;
  MARKET_PRICES_ERROR = null;

  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (p[1] === 'prices') render();

  try {
    if (!AVAILABLE_COMMODITIES.length) {
      const fRes = await fetch('/api/market-prices/filters');
      if (fRes.ok) {
        const fJson = await fRes.json();
        if (fJson.success) {
          AVAILABLE_COMMODITIES = fJson.commodities || [];
          AVAILABLE_STATES = fJson.states || [];
        }
      }
    }

    const c = commodity || SELECTED_PRICE_COMMODITY || 'Tomato';
    const s = stateId || SELECTED_PRICE_STATE || 2;
    SELECTED_PRICE_COMMODITY = c;
    SELECTED_PRICE_STATE = s;

    const res = await fetch(`/api/market-prices?commodity=${encodeURIComponent(c)}&state=${s}`);
    if (!res.ok) {
      throw new Error(`Server returned status ${res.status}`);
    }
    const data = await res.json();
    if (!data || data.success === false) {
      throw new Error(data && data.error ? data.error : 'Failed to fetch market rates');
    }

    MARKET_PRICES_DATA = data;

    if (window.DFPricing && window.DFPricing.setOfficialPrice && data.found) {
      window.DFPricing.setOfficialPrice(data.commodity, data);
    }
  } catch(err) {
    console.warn('Error loading market prices:', err);
    MARKET_PRICES_ERROR = 'Market prices are temporarily unavailable. ' + (err.message || '');
  } finally {
    MARKET_PRICES_LOADING = false;
    const curP = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (curP[1] === 'prices') render();
  }
}

function openEditLocationModal() {
  S.editDetectedLoc = null;
  S.modal = { type: 'edit_loc' };
  render();
}

function detectEditProfileGpsLocation() {
  if (!navigator.geolocation) {
    toast('Geolocation is not supported by your browser', 'err');
    return;
  }
  const btn = $('#edit_gps_btn');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner" style="width:12px;height:12px;border-width:2px;display:inline-block"></span> Detecting GPS...`;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const closest = findClosestTown(lat, lng);
      S.editDetectedLoc = { lat, lng, nearestTown: closest.n, isGps: true };
      const sel = $('#edit_town_sel');
      if (sel) sel.value = closest.n;
      updateEditLocBadge();
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `${ic('map-pin', 16)} GPS Detected (${closest.n})`;
      }
      toast(`GPS location detected: ${closest.n} (${lat.toFixed(4)}, ${lng.toFixed(4)})`, 'ok');
    },
    err => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `${ic('map-pin', 16)} Auto-Detect My Current GPS Location`;
      }
      toast('Could not detect GPS: ' + (err.message || 'Permission denied'), 'err');
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

function updateEditLocBadge() {
  const el = $('#edit_gps_status');
  if (!el) return;
  if (S.editDetectedLoc) {
    el.innerHTML = `<span style="color:var(--burgundy);font-weight:600">📍 Detected: ${S.editDetectedLoc.nearestTown} (${S.editDetectedLoc.lat.toFixed(4)}, ${S.editDetectedLoc.lng.toFixed(4)})</span>`;
  } else {
    el.innerHTML = `<span style="color:var(--ink2)">Selected from regional hub list.</span>`;
  }
}

function saveUserLocation() {
  if (!CURRENT_USER) return;
  const selTown = $('#edit_town_sel') ? $('#edit_town_sel').value : CURRENT_USER.loc.label;
  let newLoc;
  if (S.editDetectedLoc && S.editDetectedLoc.nearestTown === selTown) {
    newLoc = {
      label: selTown,
      lat: S.editDetectedLoc.lat,
      lng: S.editDetectedLoc.lng,
      isGps: true
    };
  } else {
    newLoc = town(selTown);
  }

  CURRENT_USER.loc = newLoc;
  try {
    localStorage.setItem('df_user_loc_' + CURRENT_USER.id, JSON.stringify(newLoc));
  } catch(e) {}

  if (CURRENT_USER.role === 'farmer') {
    S.fAdd.loc = newLoc.label;
    S.fAdd.detectedLoc = newLoc.isGps ? { lat: newLoc.lat, lng: newLoc.lng, nearestTown: newLoc.label, isGps: true } : null;
  }

  closeModal();
  toast(`${CURRENT_USER.role === 'farmer' ? 'Farm location' : 'Delivery address'} updated to ${newLoc.label}!`, 'ok');
  render();
}

let starVal = 0;
function setStar(n) {

  i.oninput();

function getBuyDestLoc() {

  if (S.buyDetectedLoc && S.buyDetectedLoc.nearestTown === selVal) {
    return {
      label: selVal,
      lat: S.buyDetectedLoc.lat,
      lng: S.buyDetectedLoc.lng,
      isGps: true
    };

  if (CURRENT_USER && CURRENT_USER.loc && CURRENT_USER.loc.isGps && CURRENT_USER.loc.label === selVal) {
    return { ...CURRENT_USER.loc };
